'use strict';

/* ---------- Pemutar animasi langkah penyelesaian ---------- */
function solvePlayer(p, opts) {
  const o = opts || {};
  const s = solve(p.expr, p.vals);
  const el = document.createElement('div');
  el.className = 'solver';
  el.innerHTML =
    '<div class="solver-head"><span class="lbl">Diketahui</span>' + exprHTML(p) + '<span class="lbl">jika</span>' + valsHTML(p) + '</div>' +
    '<div class="solver-main"><div class="solver-lines" aria-live="polite"></div>' +
    mathyHTML('think', 'Tekan <b>Putar</b> dan perhatikan langkahnya!', { size: 78, cls: 'solver-mathy' }) + '</div>' +
    '<div class="solver-ctrl">' +
    '<button class="btn3d btn-blue btn-sm" data-a="play">' + icon('play') + '<span>Putar</span></button>' +
    '<button class="btn3d btn-ghost btn-sm" data-a="next">Langkah berikutnya' + icon('next') + '</button>' +
    '<button class="btn3d btn-ghost btn-sm" data-a="reset">' + icon('replay') + 'Ulangi</button></div>';
  const linesEl = el.querySelector('.solver-lines'), box = el.querySelector('.mathy-box');
  const playBtn = el.querySelector('[data-a="play"]'), nextBtn = el.querySelector('[data-a="next"]');
  let i = -1, timer = null;

  function lineHTML(k) {
    return '<div class="sline"><span class="eq">' + (k === 0 ? '' : '=') + '</span><span class="expr">' + s.lines[k].html + '</span></div>';
  }
  function animateSub(ln) {
    const groups = ln.querySelectorAll('.g.subbed');
    ln.classList.add('subbing');
    groups.forEach(g => { g.dataset.num = g.innerHTML; g.innerHTML = '<span class="tk var">' + g.dataset.var + '</span>'; g.classList.add('morph'); });
    setTimeout(() => {
      groups.forEach(g => g.classList.add('flip'));
      setTimeout(() => {
        groups.forEach(g => { g.innerHTML = g.dataset.num; g.classList.remove('flip'); g.classList.add('flipped'); });
        ln.classList.remove('subbing');
        Sound.play('pop');
      }, 260);
    }, 650);
  }
  function step() {
    if (i >= s.lines.length - 1) return false;
    i++;
    linesEl.querySelectorAll('.sline.active').forEach(x => x.classList.remove('active'));
    const prev = linesEl.lastElementChild;
    if (prev) prev.classList.add('active');
    linesEl.insertAdjacentHTML('beforeend', lineHTML(i));
    const ln = linesEl.lastElementChild;
    if (animOn()) { ln.classList.add('enter'); if (i === 1) animateSub(ln); }
    const last = i === s.lines.length - 1;
    if (last) {
      ln.classList.add('final');
      setMathy(box, 'happy', s.lines[i].note + ' Jadi hasilnya <b>' + fmt(s.result) + '</b>!');
      Sound.play('correct');
      if (animOn()) starBurst(ln.querySelector('.expr'), 6);
    } else {
      setMathy(box, i === 0 ? 'think' : 'wave', s.lines[i].note);
      Sound.play('pop');
    }
    nextBtn.disabled = last;
    if (last) stop();
    return true;
  }
  function stop() { clearInterval(timer); timer = null; playBtn.querySelector('span').textContent = i >= s.lines.length - 1 ? 'Putar lagi' : 'Putar'; playBtn.querySelector('svg').outerHTML = icon(i >= s.lines.length - 1 ? 'replay' : 'play'); }
  function reset() { stop(); i = -1; linesEl.innerHTML = ''; nextBtn.disabled = false; setMathy(box, 'think', 'Tekan <b>Putar</b> dan perhatikan langkahnya!'); playBtn.querySelector('span').textContent = 'Putar'; }
  function play() {
    if (timer) { stop(); return; }
    if (i >= s.lines.length - 1) reset();
    if (!animOn()) { while (step()); return; }
    step();
    playBtn.querySelector('span').textContent = 'Jeda';
    playBtn.querySelector('svg').outerHTML = icon('pause');
    timer = setInterval(() => { if (!document.body.contains(el)) { stop(); return; } if (!step()) stop(); }, o.speed || 1900);
  }
  el.querySelector('[data-a="play"]').addEventListener('click', play);
  el.querySelector('[data-a="next"]').addEventListener('click', () => { if (timer) stop(); step(); });
  el.querySelector('[data-a="reset"]').addEventListener('click', reset);
  if (o.autoplay) setTimeout(() => { if (document.body.contains(el)) play(); }, 500);
  return { el, play, reset, solution: s };
}

/** Pembahasan statis (tanpa animasi) */
function staticSolution(p) {
  const s = solve(p.expr, p.vals);
  return '<div class="static-sol"><div class="calc">' + s.lines.map((l, k) =>
    '<div class="sline' + (k === s.lines.length - 1 ? ' final' : '') + '"><span class="eq">' + (k === 0 ? '' : '=') + '</span><span class="expr">' + render(l.tree) + '</span></div>').join('') +
    '</div><ol class="sol-notes">' + s.lines.slice(1).map(l => '<li>' + l.note + '</li>').join('') + '</ol></div>';
}

/* ---------- Jenis soal ---------- */
function promptBlock(title, p, extra) {
  return '<p class="q-title">' + title + '</p><div class="q-card"><div class="q-expr">' + exprHTML(p) + '</div><div class="q-vals">jika ' + valsHTML(p) + '</div>' + (extra || '') + '</div>';
}
function makeItem(type, p) {
  const s = solve(p.expr, p.vals);
  const base = { type, p, s };
  switch (type) {
    case 'mc': {
      const o = numberOptions(p);
      return Object.assign(base, { kind: 'choice', prompt: promptBlock('Berapa hasilnya?', p), options: o.options.map(v => ({ html: fmt(v), value: v, hint: o.hints[v] })), answer: p.result, answerText: fmt(p.result) });
    }
    case 'input': {
      const m = mistakes(p);
      return Object.assign(base, { kind: 'number', prompt: promptBlock('Ketik hasilnya', p), answer: p.result, answerText: fmt(p.result), hints: m.hints });
    }
    case 'subform': {
      const correctHTML = render(s.lines[1].tree);
      const cands = [];
      const pushC = (tree, opt, hint) => { const html = render(tree, opt); if (toText(html) !== toText(correctHTML) && !cands.some(c => toText(c.html) === toText(html))) cands.push({ html, hint }); };
      pushC(s.lines[1].tree, { concat: true }, MISTAKE_HINT.concat);
      pushC(s.lines[1].tree, { impPlus: true }, MISTAKE_HINT.addImp);
      const names = Object.keys(p.vals);
      if (names.length === 2) { const sw = { [names[0]]: p.vals[names[1]], [names[1]]: p.vals[names[0]] }; if (sw[names[0]] !== p.vals[names[0]]) pushC(substituteTree(p.expr, sw, new Set()), {}, 'Perhatikan: ' + valsText(p) + '. Jangan tertukar.'); }
      [1, 2, -1, 3].forEach(d => { if (cands.length < 3) { const v2 = {}; names.forEach(n => { v2[n] = p.vals[n] + d; }); pushC(substituteTree(p.expr, v2, new Set()), {}, 'Perhatikan nilai variabelnya: ' + valsText(p) + '.'); } });
      const opts = shuffle([{ html: correctHTML, value: 'ok' }].concat(cands.slice(0, 3).map((c, k) => ({ html: c.html, value: 'w' + k, hint: c.hint }))));
      return Object.assign(base, { kind: 'choice', prompt: promptBlock('Pilih hasil substitusi yang benar', p), options: opts.map(x => Object.assign(x, { html: '<span class="expr">' + x.html + '</span>' })), answer: 'ok', answerText: toText(correctHTML), mono: true });
    }
    case 'tf': {
      const m = mistakes(p);
      const truth = rnd() < 0.5 || !m.values.length;
      const claim = truth ? p.result : pick(m.values);
      const stmt = '<div class="tf-claim">Jika ' + valsHTML(p) + ', maka<br>' + exprHTML(p) + ' <span class="tk op">=</span> <b class="claim">' + fmt(claim) + '</b></div>';
      return Object.assign(base, {
        kind: 'choice', prompt: '<p class="q-title">Benar atau salah?</p><div class="q-card">' + stmt + '</div>',
        options: [{ html: icon('check') + 'Benar', value: true, hint: truth ? null : null }, { html: icon('x') + 'Salah', value: false }],
        answer: claim === p.result, answerText: claim === p.result ? 'Benar' : 'Salah (hasilnya ' + fmt(p.result) + ')', tf: true,
        wrongHint: claim === p.result ? 'Coba hitung lagi, ternyata hasilnya memang ' + fmt(p.result) + '.' : (m.hints[claim] || MISTAKE_HINT.generic)
      });
    }
    case 'order': {
      const tiles = s.lines.slice(1).map(l => render(l.tree));
      if (tiles.length < 3 || new Set(tiles.map(toText)).size !== tiles.length) return makeItem('mc', p);
      return Object.assign(base, {
        kind: 'order', prompt: '<p class="q-title">Susun langkah penyelesaiannya</p><div class="q-card"><div class="q-expr">' + exprHTML(p) + '</div><div class="q-vals">jika ' + valsHTML(p) + '</div></div>',
        tiles, answerText: s.lines.slice(1).map(l => l.text).join('  →  ')
      });
    }
    case 'blank':
    case 'blankSub': {
      let k, id;
      if (type === 'blankSub') { k = 1; id = Array.from(s.lines[1].fresh)[0]; }
      else {
        const cand = [];
        for (let j = 2; j < s.lines.length - 1; j++) if (s.lines[j].fresh.size) cand.push(j);
        k = cand.length ? pick(cand) : s.lines.length - 1;
        id = Array.from(s.lines[k].fresh)[0];
      }
      const node = findNode(s.lines[k].tree, id);
      const showUntil = type === 'blankSub' ? 1 : s.lines.length - 1;
      const chain = s.lines.slice(0, showUntil + 1).map((l, j) => '<div class="sline"><span class="eq">' + (j === 0 ? '' : '=') + '</span><span class="expr">' + (j === k ? render(l.tree, { blank: id }) : render(l.tree)) + '</span></div>').join('');
      return Object.assign(base, {
        kind: 'number', prompt: '<p class="q-title">Isi angka yang hilang</p><div class="q-card"><div class="q-vals">' + valsHTML(p) + '</div><div class="calc chain">' + chain + '</div></div>',
        answer: node.v, answerText: fmt(node.v), hints: {},
        blankHint: type === 'blankSub' ? 'Kotak itu diisi nilai variabelnya: ' + valsText(p) + '.' : 'Lihat baris sebelumnya, lalu hitung bagian yang ditandai.'
      });
    }
  }
  throw new Error('jenis soal tidak dikenal: ' + type);
}

/** Membuat daftar soal unik dari resep [{type, op, level}] */
function buildItems(recipe) {
  const seen = new Set(), out = [];
  recipe.forEach(r => {
    let it, tries = 0;
    do { it = makeItem(r.type, genProblem(r.op, r.level)); tries++; } while (seen.has(it.type + toText(it.prompt)) && tries < 20);
    seen.add(it.type + toText(it.prompt));
    out.push(it);
  });
  return out;
}

/* ---------- Penilaian ---------- */
function checkItem(item, ans) {
  if (item.kind === 'choice') {
    const opt = item.options.find(o => o.value === ans);
    const ok = ans === item.answer;
    return { ok, given: opt ? toText(opt.html) : '', hint: ok ? null : (item.tf ? item.wrongHint : (opt && opt.hint) || MISTAKE_HINT.generic) };
  }
  if (item.kind === 'number') {
    const v = parseAnswer(ans);
    const ok = v === item.answer;
    return { ok, given: ans, hint: ok ? null : (item.blankHint || (item.hints && item.hints[v]) || MISTAKE_HINT.generic) };
  }
  if (item.kind === 'order') {
    const ok = ans.every((t, k) => t === k);
    return { ok, given: ans.map(k => toText(item.tiles[k])).join(' → '), hint: ok ? null : 'Mulai dari substitusi, lalu kerjakan kurung, perkalian/pembagian, baru penjumlahan/pengurangan.' };
  }
  return { ok: false, given: '', hint: '' };
}

/* ---------- Tampilan input tiap jenis soal ---------- */
function mountAnswer(area, item, onChange, exam, preset) {
  let value = preset == null ? null : preset;
  if (item.kind === 'choice') {
    const keys = ['1', '2', '3', '4'];
    area.innerHTML = '<div class="choices ' + (item.tf ? 'tf' : '') + (item.mono ? ' mono' : '') + '">' + item.options.map((o, k) =>
      '<button class="choice" data-k="' + k + '"><span class="ck">' + keys[k] + '</span><span class="cv">' + o.html + '</span></button>').join('') + '</div>';
    const btns = area.querySelectorAll('.choice');
    btns.forEach((b, k) => {
      if (preset != null && item.options[k].value === preset) b.classList.add('sel');
      b.addEventListener('click', () => {
        if (area.classList.contains('locked')) return;
        btns.forEach(x => x.classList.remove('sel'));
        b.classList.add('sel'); Sound.play('tap');
        value = item.options[k].value; onChange(value);
      });
    });
    area._key = (e) => { const k = keys.indexOf(e.key); if (k >= 0 && btns[k]) btns[k].click(); };
  } else if (item.kind === 'number') {
    area.innerHTML = '<div class="num-entry"><input class="num-input" id="numAns" inputmode="none" autocomplete="off" placeholder="?" aria-label="Jawaban"></div>' +
      '<div class="keypad">' + ['1', '2', '3', '4', '5', '6', '7', '8', '9', '−', '0', '⌫'].map(k => '<button class="key' + (k === '⌫' ? ' back' : '') + '" data-key="' + k + '">' + (k === '⌫' ? icon('backspace') : k) + '</button>').join('') + '</div>';
    const inp = area.querySelector('input');
    if (preset != null) inp.value = preset;
    const emit = () => { value = inp.value.trim(); onChange(value === '' || value === '-' || value === MINUS ? null : value); };
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9\-−]/g, '').replace(/(?!^)[-−]/g, ''); emit(); });
    area.querySelectorAll('.key').forEach(k => k.addEventListener('click', () => {
      if (area.classList.contains('locked')) return;
      const key = k.dataset.key; Sound.play('tap');
      if (key === '⌫') inp.value = inp.value.slice(0, -1);
      else if (key === '−') inp.value = inp.value.startsWith(MINUS) || inp.value.startsWith('-') ? inp.value.slice(1) : MINUS + inp.value;
      else if (inp.value.replace(/[-−]/, '').length < 6) inp.value += key;
      k.classList.remove('hit'); void k.offsetWidth; k.classList.add('hit');
      emit();
    }));
    if (window.matchMedia('(pointer: fine)').matches) { inp.removeAttribute('inputmode'); setTimeout(() => inp.focus({ preventScroll: true }), 50); }
  } else if (item.kind === 'order') {
    const order = shuffle(item.tiles.map((_, k) => k));
    const picked = [];
    const draw = () => {
      area.innerHTML = '<div class="order-slots">' + (picked.length ? picked.map((k, j) => '<button class="tile placed" data-p="' + j + '"><span class="tn">' + (j + 1) + '</span><span class="expr">' + item.tiles[k] + '</span></button>').join('') : '<p class="muted small">Ketuk langkah di bawah sesuai urutan.</p>') + '</div>' +
        '<div class="order-bank">' + order.map(k => '<button class="tile ' + (picked.includes(k) ? 'used' : '') + '" data-k="' + k + '"><span class="eq">=</span><span class="expr">' + item.tiles[k] + '</span></button>').join('') + '</div>';
      area.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
        if (area.classList.contains('locked')) return;
        const k = +b.dataset.k; if (picked.includes(k)) return;
        picked.push(k); Sound.play('tap'); draw();
        value = picked.length === item.tiles.length ? picked.slice() : null;
        onChange(value);
      }));
      area.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => {
        if (area.classList.contains('locked')) return;
        picked.splice(+b.dataset.p, 1); Sound.play('tap'); draw(); value = null; onChange(null);
      }));
    };
    draw();
  }
  return () => value;
}

/* ---------- Mesin sesi ----------
   cfg: { items, title, exitHref, xpPer, exam, onFinish(summary, root), thinking } */
const THINK_LINES = ['Ganti variabelnya dulu, ya!', 'Pelan-pelan saja, kamu pasti bisa!', 'Ingat urutannya: kurung, kali/bagi, lalu tambah/kurang.', 'Aku yakin kamu bisa!', 'Coba hitung di kepala atau di kertas.'];
const GOOD_LINES = ['Hebat!', 'Tepat sekali!', 'Keren banget!', 'Mantap!', 'Luar biasa!', 'Kamu jago!'];
function runSession(root, cfg) {
  document.body.classList.add('focus-mode');
  const items = cfg.items, n = items.length, xpPer = cfg.xpPer == null ? 10 : cfg.xpPer;
  const results = new Array(n).fill(null), answers = new Array(n).fill(null);
  let idx = 0, phase = 'answer', getVal = null, xpGained = 0;
  root.innerHTML =
    '<div class="lesson">' +
    '<div class="lesson-top"><button class="icon-btn" data-exit aria-label="Keluar">' + icon('x') + '</button>' +
    '<div class="lbar"><span></span></div><span class="lcount"></span></div>' +
    '<div class="lesson-stage"></div>' +
    '<div class="lesson-foot"><div class="foot-inner"><div class="fb"></div><div class="foot-btns">' +
    (cfg.exam ? '<button class="btn3d btn-ghost" data-prev>' + icon('back') + 'Sebelumnya</button>' : '') +
    '<button class="btn3d btn-mint" data-main disabled>PERIKSA</button></div></div></div></div>';
  const stage = root.querySelector('.lesson-stage'), foot = root.querySelector('.lesson-foot'), fb = root.querySelector('.fb');
  const main = root.querySelector('[data-main]'), bar = root.querySelector('.lbar span'), count = root.querySelector('.lcount');
  const prevBtn = root.querySelector('[data-prev]');

  root.querySelector('[data-exit]').addEventListener('click', () => {
    confirmBox('Yakin mau keluar? Jawaban di sesi ini tidak akan disimpan.', 'Ya, keluar', () => { location.hash = cfg.exitHref || '#beranda'; }, { danger: true });
  });
  if (prevBtn) prevBtn.addEventListener('click', () => { if (idx > 0) { answers[idx] = getVal ? getVal() : answers[idx]; idx--; show(); } });

  function updateTop() {
    const done = cfg.exam ? answers.filter(a => a != null).length : results.filter(r => r).length;
    bar.style.width = (done / n * 100) + '%';
    count.textContent = done + '/' + n;
  }
  function show() {
    const it = items[idx];
    phase = it.kind === 'teach' ? 'teach' : 'answer';
    foot.className = 'lesson-foot';
    fb.innerHTML = '';
    updateTop();
    if (prevBtn) prevBtn.disabled = idx === 0;
    if (it.kind === 'teach') {
      stage.innerHTML = '<div class="q-wrap teach enter"><div class="teach-body"></div></div>';
      const body = stage.querySelector('.teach-body');
      body.innerHTML = it.html;
      if (it.after) it.after(body);
      main.disabled = false; main.textContent = 'LANJUT'; main.className = 'btn3d btn-mint';
      getVal = null;
      return;
    }
    stage.innerHTML = '<div class="q-wrap enter"><div class="q-main">' + (cfg.exam ? '<span class="q-num">Soal ' + (idx + 1) + ' dari ' + n + '</span>' : '') + it.prompt + '<div class="answer-area"></div></div>' +
      '<div class="q-side">' + mathyHTML('think', cfg.exam ? 'Kerjakan dengan teliti, ya!' : pick(THINK_LINES), { size: 110 }) + '</div></div>';
    const area = stage.querySelector('.answer-area');
    main.className = 'btn3d btn-mint';
    main.textContent = cfg.exam ? (idx === n - 1 ? 'SELESAI' : 'LANJUT') : 'PERIKSA';
    getVal = mountAnswer(area, it, (v) => { main.disabled = v == null; if (cfg.exam) answers[idx] = v; }, cfg.exam, cfg.exam ? answers[idx] : null);
    main.disabled = getVal() == null || getVal() === '';
    stage._keyArea = area;
  }
  function check() {
    const it = items[idx];
    const val = getVal();
    if (val == null || val === '') return;
    const r = checkItem(it, val);
    if (it.kind === 'number' && isNaN(parseAnswer(val))) { toast('Ketik angka bulat, misalnya 12 atau −5', 'warn'); return; }
    results[idx] = r; answers[idx] = val;
    recordAnswer(r.ok);
    const area = stage.querySelector('.answer-area');
    area.classList.add('locked');
    const box = stage.querySelector('.q-side .mathy-box');
    if (it.kind === 'choice') {
      area.querySelectorAll('.choice').forEach((b, k) => { const o = it.options[k]; if (o.value === it.answer) b.classList.add('right'); else if (o.value === val) b.classList.add('wrong'); });
    } else if (it.kind === 'number') {
      const inp = area.querySelector('input'); inp.classList.add(r.ok ? 'right' : 'wrong'); inp.disabled = true;
    } else {
      area.querySelectorAll('.tile.placed').forEach(t => t.classList.add(r.ok ? 'right' : 'wrong'));
    }
    if (r.ok) {
      xpGained += xpPer;
      Sound.play('correct');
      setMathy(box, 'happy', pick(GOOD_LINES));
      if (xpPer) { addXP(xpPer); floatText(main, '+' + xpPer + ' XP', 'xp'); }
      starBurst(main, 8);
      if (animOn()) confetti(18);
    } else {
      Sound.play('wrong');
      setMathy(box, 'cheer', r.hint || MISTAKE_HINT.generic);
    }
    updateTop();
    foot.className = 'lesson-foot ' + (r.ok ? 'good' : 'bad');
    fb.innerHTML = '<div class="fb-row"><span class="fb-ic">' + icon(r.ok ? 'check' : 'x') + '</span><div><b class="fb-title">' + (r.ok ? pick(GOOD_LINES) + (xpPer ? ' +' + xpPer + ' XP' : '') : 'Belum tepat, tidak apa-apa!') + '</b>' +
      (r.ok ? '' : '<p>Jawaban benar: <b>' + it.answerText + '</b></p>') + '</div></div>' +
      '<button class="link-btn" data-sol>' + icon('eye') + 'Lihat pembahasan</button><div class="fb-sol" hidden></div>';
    fb.querySelector('[data-sol]').addEventListener('click', (e) => {
      const sol = fb.querySelector('.fb-sol');
      if (sol.hidden) {
        sol.hidden = false; sol.innerHTML = '';
        const pl = solvePlayer(it.p, { autoplay: true, speed: 1500 });
        sol.appendChild(pl.el);
        e.currentTarget.innerHTML = icon('x') + 'Tutup pembahasan';
      } else { sol.hidden = true; sol.innerHTML = ''; e.currentTarget.innerHTML = icon('eye') + 'Lihat pembahasan'; }
    });
    main.disabled = false; main.textContent = 'LANJUT'; main.className = 'btn3d ' + (r.ok ? 'btn-mint' : 'btn-red');
    phase = 'feedback';
    main.focus({ preventScroll: true });
  }
  function next() {
    if (idx < n - 1) { idx++; show(); return; }
    finish();
  }
  function finish() {
    if (cfg.exam) {
      items.forEach((it, k) => { if (it.kind !== 'teach') { const v = answers[k]; results[k] = v == null ? { ok: false, given: '', hint: '' } : checkItem(it, v); recordAnswer(results[k].ok); } });
    }
    const q = items.map((it, k) => ({ it, r: results[k], a: answers[k] })).filter(x => x.it.kind !== 'teach');
    const correct = q.filter(x => x.r && x.r.ok).length;
    bar.style.width = '100%';
    cfg.onFinish({ correct, total: q.length, xp: xpGained, list: q }, root);
  }
  main.addEventListener('click', () => {
    if (main.disabled) return;
    if (phase === 'teach') { Sound.play('tap'); next(); return; }
    if (cfg.exam) { answers[idx] = getVal(); Sound.play('tap'); next(); return; }
    if (phase === 'answer') check(); else next();
  });
  const onKey = (e) => {
    if (!document.body.contains(root.querySelector('.lesson'))) { document.removeEventListener('keydown', onKey); return; }
    if (document.querySelector('.modal-backdrop')) return;
    if (e.key === 'Enter') { e.preventDefault(); main.click(); return; }
    if (phase === 'answer' && stage._keyArea && stage._keyArea._key && !(e.target && e.target.tagName === 'INPUT')) stage._keyArea._key(e);
  };
  document.addEventListener('keydown', onKey);
  show();
}

    if (b.href) location.hash = b.href; if (b.onClick) b.onClick();
  }));
  setTimeout(() => flushLevelUps(), 1300);
}
function escapeHTML(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

}

/* ================= TAHAPAN (sesi petualangan) ================= */
function stageRecipe(op, n) {
  const R = (type, level) => ({ type, op, level });
  if (n === 1) return [R('subform', 1), R('mc', 1), R('input', 1)];
  if (n === 2) return [R('blankSub', 1), R('subform', 1), R('subform', 2), R('tf', 1), R('blankSub', 2), R('blank', 1)];
  if (n === 3) return [R('mc', 1), R('input', 1), R('order', 2), R('blank', 2), R('mc', 2), R('input', 2), R('tf', 2), R('order', 1)];
  return [R('mc', 2), R('input', 2), R('mc', 3), R('input', 3), R('order', 3), R('blank', 3), R('subform', 3), R('input', 3)];
}
function teachSlides(op) {
  const w = worldOf(op), M = MATERI[op];
  return [
    { kind: 'teach', html: '<div class="teach-intro ' + w.color + '">' + mathyHTML('wave', 'Selamat datang di <b>' + w.land + '</b>! Yuk kenalan dengan ' + w.title.toLowerCase() + '.', { size: 130 }) +
      '<h2>' + w.title + '</h2><p>' + M.intro + '</p><div class="konsep">' + M.konsep.map(k => '<div class="kc"><small>' + k[0] + '</small><b>' + k[1] + '</b></div>').join('') + '</div></div>' },
    { kind: 'teach', html: '<h2 class="teach-h">Lihat ilustrasinya</h2><p class="muted">Tekan tombol kuning untuk mengisi kantong dengan nilai variabel.</p><div class="illus-slot"></div>',
      after: (el) => el.querySelector('.illus-slot').appendChild(illusElement(op)) },
    { kind: 'teach', html: '<h2 class="teach-h">Contoh soal dengan animasi</h2><div class="player-slot"></div><ol class="steps">' + M.langkah.map(l => '<li>' + l + '</li>').join('') + '</ol>',
      after: (el) => el.querySelector('.player-slot').appendChild(solvePlayer(Object.assign({}, mainExample(op)), { autoplay: true }).el) }
  ];
}
function viewTahap(page, key) {
  const i = stageIndex(key);
  if (i < 0) { location.hash = '#peta'; return; }
  if (!stageUnlocked(key)) { toast('Tahapan ini masih terkunci.', 'warn'); location.hash = '#peta'; return; }
  const s = STAGES[i];
  const items = (s.n === 1 ? teachSlides(s.op) : []).concat(buildItems(stageRecipe(s.op, s.n)));
  if (s.n === 1) { Store.d.materiRead[s.op] = true; Store.save(); }
  runSession(page, {
    items, exitHref: '#peta',
    onFinish(sum, root) {
      const acc = sum.total ? sum.correct / sum.total : 0;
      const stars = acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1;
      const prev = Store.d.stages[key] || {};
      const first = !prev.done;
      Store.d.stages[key] = { done: true, stars: Math.max(prev.stars || 0, stars), best: Math.max(prev.best || 0, Math.round(acc * 100)) };
      if (first) Store.d.daily.stages++;
      Store.save();
      addXP(first ? 20 : 5);
      const worldFinished = s.n === 4 && first;
      Sound.play('finish'); confetti(worldFinished ? 140 : 70);
      const next = STAGES[i + 1];
      endScreen(root, {
        title: worldFinished ? 'Dunia ' + s.world.num + ' Selesai!' : stars === 3 ? 'Sempurna!' : 'Tahapan Selesai!',
        sub: worldFinished ? 'Kamu menaklukkan ' + s.world.land + '. ' + (next ? 'Dunia berikutnya sudah terbuka!' : 'Semua dunia sudah kamu taklukkan!') : s.title,
        stars, xp: sum.xp + (first ? 20 : 5), correct: sum.correct, total: sum.total, list: sum.list, trophy: worldFinished,
        buttons: [{ label: 'ULANGI', cls: 'btn-ghost', onClick: () => router() }].concat(next && worldFinished ? [{ label: 'KE PETA', cls: 'btn-blue', href: '#peta' }] : [{ label: 'LANJUT', cls: 'btn-mint', href: '#peta' }])
      });
    }
  });
}

      '<div class="setup card">' + mathyHTML('cheer', 'Tidak perlu terburu-buru. Pilih waktu yang nyaman untukmu!', { size: 110 }) +
      '<h3>1. Tingkat kesulitan</h3><div class="diff-grid">' + Object.keys(DIFF).map(k => '<button class="diff ' + DIFF[k].color + (diff === k ? ' on' : '') + '" data-d="' + k + '"><b>' + DIFF[k].name + '</b><small>' + DIFF[k].pts + ' poin / soal</small><small>Rekor: ' + d.stats.challengeBest[k] + '</small></button>').join('') + '</div>' +
      '<h3>2. Waktu per soal</h3><div class="chips">' + TIMER_OPTS.map(t => '<button class="chip3d ' + (timer === t[0] ? 'on' : '') + '" data-tm="' + t[0] + '">' + icon(t[0] ? 'timer' : 'sparkle') + t[1] + '</button>').join('') + '</div>' +
      '<h3>3. Operasi</h3><div class="chips">' + WORLDS.map(w => '<button class="chip3d ' + (ops.includes(w.op) ? 'on' : '') + '" data-op="' + w.op + '">' + icon(w.icon) + w.title.replace(' Aljabar', '') + '</button>').join('') + '</div>' +
      '<button class="btn3d btn-yellow btn-lg" id="go">' + icon('bolt') + 'MULAI CHALLENGE</button></div>';
    page.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => { diff = b.dataset.d; Sound.play('tap'); setup(); }));
    page.querySelectorAll('[data-tm]').forEach(b => b.addEventListener('click', () => { timer = +b.dataset.tm; d.settings.timer = timer; Store.save(); Sound.play('tap'); setup(); }));
    page.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => {
      const o = b.dataset.op;
      if (ops.includes(o)) { if (ops.length === 1) { toast('Pilih minimal satu operasi.', 'warn'); return; } ops = ops.filter(x => x !== o); } else ops.push(o);
      Sound.play('tap'); setup();
    }));
    page.querySelector('#go').addEventListener('click', play);
  }
  function play() {
    document.body.classList.add('focus-mode');
    const ROUNDS = 10, D = DIFF[diff];
    let round = 0, score = 0, correct = 0, combo = 0, bestCombo = 0, left = timer, tick = null, paused = false, cur = null, locked = false, xp = 0;
    page.innerHTML = '<div class="challenge">' +
      '<div class="lesson-top"><button class="icon-btn" data-exit aria-label="Keluar">' + icon('x') + '</button><div class="lbar"><span></span></div>' +
      '<button class="icon-btn" data-pause aria-label="Jeda">' + icon('pause') + '</button></div>' +
      '<div class="hud"><div class="hud-t yellow"><small>SKOR</small><b id="hScore">0</b></div><div class="hud-t blue"><small>SOAL</small><b id="hRound">1/' + ROUNDS + '</b></div>' +
      '<div class="hud-t coral"><small>KOMBO</small><b id="hCombo">0</b></div><div class="hud-t mint timer-t"><small>WAKTU</small><b id="hTime">' + (timer ? timer : '∞') + '</b></div></div>' +
      (timer ? '<div class="time-bar"><span></span></div>' : '<div class="time-bar relax"><span style="width:100%"></span></div>') +
      '<div class="ch-card"><div class="ch-q"></div><div class="answer-area"></div><div class="ch-fb"></div></div>' +
      '<div class="ch-foot"><button class="btn3d btn-ghost" id="skip">Lewati</button><button class="btn3d btn-yellow" id="ans" disabled>JAWAB</button></div>' +
      '<div class="ch-mathy">' + mathyHTML('think', 'Ayo, kamu bisa!', { size: 90 }) + '</div></div>';
    const q = page.querySelector('.ch-q'), area = page.querySelector('.answer-area'), fbEl = page.querySelector('.ch-fb');
    const ansBtn = page.querySelector('#ans'), skipBtn = page.querySelector('#skip'), box = page.querySelector('.ch-mathy .mathy-box');
    const tb = page.querySelector('.time-bar span');
    let getVal = null;
    const alive = () => document.body.contains(ansBtn);
    function stopTick() { clearInterval(tick); tick = null; }
    function startTick() {
      stopTick();
      if (!timer) return;
      tick = setInterval(() => {
        if (!alive()) { stopTick(); return; }
        if (paused || locked) return;
        left = Math.max(0, left - 0.1);
        page.querySelector('#hTime').textContent = Math.ceil(left);
        tb.style.width = (left / timer * 100) + '%';
        tb.parentElement.className = 'time-bar' + (left / timer < 0.25 ? ' low' : left / timer < 0.5 ? ' mid' : '');
        if (left <= 0) timeUp();
      }, 100);
    }
    function nextQ() {
      if (round >= ROUNDS) { end(); return; }
      cur = makeItem('input', genProblem(pick(ops), D.level));
      locked = false; left = timer;
      page.querySelector('#hRound').textContent = (round + 1) + '/' + ROUNDS;
      page.querySelector('.lesson-top .lbar span').style.width = (round / ROUNDS * 100) + '%';
      q.innerHTML = '<span class="pill ' + worldOf(cur.p.op).color + '">' + OP_LABEL[cur.p.op] + '</span><div class="ch-expr">' + exprHTML(cur.p) + '</div><div class="q-vals">jika ' + valsHTML(cur.p) + '</div>';
      q.classList.remove('enter'); void q.offsetWidth; q.classList.add('enter');
      fbEl.innerHTML = '';
      getVal = mountAnswer(area, cur, v => { ansBtn.disabled = v == null; });
      ansBtn.disabled = true; ansBtn.textContent = 'JAWAB'; skipBtn.hidden = false;
      setMathy(box, 'think', pick(['Ayo, kamu bisa!', 'Ganti variabelnya dulu.', 'Tenang, fokus ya.']));
      if (timer) { tb.style.width = '100%'; page.querySelector('#hTime').textContent = timer; }
      startTick();
    }
    function resolve(ok, msg) {
      locked = true; stopTick();
      area.classList.add('locked');
      skipBtn.hidden = true;
      recordAnswer(ok);
      if (ok) {
        correct++; combo++; bestCombo = Math.max(bestCombo, combo);
        let pts = D.pts + (timer ? Math.round(D.pts * 0.5 * (left / timer)) : 0) + (combo >= 3 ? 5 : 0);
        score += pts; xp += 10; addXP(10);
        Sound.play('correct'); confetti(24); starBurst(ansBtn, 8); floatText(page.querySelector('#hScore'), '+' + pts, 'pts');
        setMathy(box, 'happy', pick(GOOD_LINES) + (combo >= 3 ? ' Kombo ' + combo + '!' : ''));
        const hs = page.querySelector('#hScore'); countUp(hs, score, 500);
      } else {
        combo = 0; Sound.play('wrong');
        setMathy(box, 'cheer', msg || MISTAKE_HINT.generic);
      }
      page.querySelector('#hCombo').textContent = combo;
      fbEl.innerHTML = '<div class="ch-res ' + (ok ? 'good' : 'bad') + '">' + (ok ? icon('check') + 'Benar!' : icon('x') + 'Jawaban: <b>' + fmt(cur.p.result) + '</b>') + '</div>' + (ok ? '' : staticSolution(cur.p));
      round++;
      ansBtn.disabled = false; ansBtn.textContent = round >= ROUNDS ? 'LIHAT HASIL' : 'LANJUT';
      ansBtn.focus({ preventScroll: true });
    }
    function timeUp() { if (locked) return; const inp = area.querySelector('input'); if (inp) inp.disabled = true; resolve(false, 'Waktu habis, tidak apa-apa! Lihat caranya, lalu coba soal berikutnya.'); }
    ansBtn.addEventListener('click', () => {
      if (locked) { nextQ(); return; }
      const v = getVal(); if (v == null) return;
      if (isNaN(parseAnswer(v))) { toast('Ketik angka bulat, misalnya 12 atau −5', 'warn'); return; }
      const ok = parseAnswer(v) === cur.p.result;
      const inp = area.querySelector('input'); inp.disabled = true; inp.classList.add(ok ? 'right' : 'wrong');
      resolve(ok, cur.hints[parseAnswer(v)]);
    });
    skipBtn.addEventListener('click', () => { if (!locked) resolve(false, 'Soal dilewati. Tidak apa-apa, lihat caranya ya.'); });
    page.querySelector('[data-exit]').addEventListener('click', () => { paused = true; confirmBox('Keluar dari Math Challenge? Skor permainan ini tidak disimpan.', 'Ya, keluar', () => { stopTick(); setup(); }, { danger: true }); setTimeout(() => { if (!document.querySelector('.modal-backdrop')) paused = false; }, 100); watchModal(); });
    function watchModal() { const iv = setInterval(() => { if (!document.querySelector('.modal-backdrop')) { paused = false; clearInterval(iv); } if (!alive()) clearInterval(iv); }, 200); }
    page.querySelector('[data-pause]').addEventListener('click', () => {
      paused = true;
      modal(mathyHTML('wave', 'Istirahat sebentar. Waktu berhenti dulu.', { size: 110, cls: 'center' }) + '<h2 class="center">Permainan dijeda</h2>', [{ label: 'LANJUTKAN', cls: 'btn-mint' }]);
      watchModal();
    });
    const onKey = (e) => { if (!alive()) { document.removeEventListener('keydown', onKey); return; } if (e.key === 'Enter' && !document.querySelector('.modal-backdrop')) { e.preventDefault(); ansBtn.click(); } };
    document.addEventListener('keydown', onKey);
    function end() {
      stopTick();
      const best = d.stats.challengeBest[diff], rec = score > best;
      d.stats.challengeBest[diff] = Math.max(best, score); d.stats.challengePlayed++; Store.save(); checkBadges();
      Sound.play('finish'); confetti(correct >= 7 ? 120 : 50);
      endScreen(page, {
        title: rec && score > 0 ? 'Rekor Baru!' : 'Challenge Selesai!',
        sub: 'Level ' + D.name + ' · ' + (timer ? timer + ' detik per soal' : 'mode santai') + ' · Kombo terbaik ' + bestCombo,
        mood: correct >= 5 ? 'celebrate' : 'cheer', trophy: rec && score > 0,
        extra: '<div class="big-score"><small>SKOR</small><b data-c="' + score + '">0</b><span>Rekor ' + D.name + ': ' + d.stats.challengeBest[diff] + '</span></div>',
        xp, correct, total: ROUNDS, list: [],
        buttons: [{ label: 'UBAH PENGATURAN', cls: 'btn-ghost', onClick: setup }, { label: 'MAIN LAGI', cls: 'btn-yellow', onClick: play }]
      });
      page.querySelectorAll('.big-score [data-c]').forEach(s => countUp(s, +s.dataset.c, 1200));
    }
    nextQ();
  }
  setup();
}

const EVAL_PLAN = [
  ['add', 1, 'mc'], ['sub', 1, 'mc'], ['mul', 1, 'subform'], ['div', 1, 'mc'], ['add', 1, 'mc'],
  ['sub', 2, 'mc'], ['mul', 2, 'mc'], ['div', 2, 'subform'], ['add', 2, 'mc'], ['sub', 2, 'mc'],
  ['mul', 2, 'mc'], ['div', 2, 'mc'], ['add', 3, 'mc'], ['sub', 3, 'subform'], ['mul', 3, 'mc'],
  ['div', 3, 'mc'], ['add', 3, 'mc'], ['sub', 3, 'mc'], ['mix', 3, 'mc'], ['mix', 3, 'mc']
];
function evalMessage(n) {
  if (n >= 90) return { mood: 'celebrate', title: 'Sangat Baik', cls: 'mint', text: 'Luar biasa! Kamu benar-benar menguasai substitusi aljabar. MATHY bangga padamu!' };
  if (n >= 75) return { mood: 'happy', title: 'Baik (Tuntas)', cls: 'blue', text: 'Hebat! Kamu sudah tuntas. Pelajari soal yang masih salah agar makin sempurna.' };
  if (n >= 60) return { mood: 'cheer', title: 'Cukup (Belum Tuntas)', cls: 'yellow', text: 'Sedikit lagi! Ulangi materi yang masih salah, lalu coba evaluasi lagi. Kamu pasti bisa!' };
  return { mood: 'cheer', title: 'Perlu Bimbingan', cls: 'coral', text: 'Jangan menyerah! Yuk belajar lagi di Petualangan bersama MATHY, lalu coba evaluasi lagi.' };
}
function viewEvaluasi(page) {
  const e = Store.d.evaluasi;

  });
}

/* =========================================================
   SUBMET – Kerangka aplikasi, navigasi, sapaan awal
   ========================================================= */
'use strict';

const NAV = [
  { r: 'beranda', label: 'Beranda', icon: 'home', tab: true },
  { r: 'peta', label: 'Petualangan', short: 'Peta', icon: 'map', tab: true },
  { r: 'materi', label: 'Materi', icon: 'book' },
  { r: 'latihan', label: 'Latihan', icon: 'pencil', tab: true },
  { r: 'challenge', label: 'Math Challenge', short: 'Challenge', icon: 'timer', tab: true },
  { r: 'harian', label: 'Tantangan Harian', icon: 'calendar' },
  { r: 'evaluasi', label: 'Evaluasi', icon: 'award' },
  { r: 'profil', label: 'Profil', icon: 'user', tab: true },
  { r: 'pengaturan', label: 'Pengaturan', icon: 'gear' }
];
const ROUTES = {
  beranda: viewHome, peta: viewPeta, tahap: viewTahap, materi: viewMateri, latihan: viewLatihan, challenge: viewChallenge,
  harian: viewHarian, evaluasi: viewEvaluasi, profil: viewProfil, pengaturan: viewPengaturan, bantuan: viewBantuan, sertifikat: viewSertifikat
};

function renderShell() {
  document.getElementById('sidenav').innerHTML = NAV.map(n => '<a href="#' + n.r + '" data-r="' + n.r + '">' + icon(n.icon) + '<span>' + n.label + '</span></a>').join('');
  document.getElementById('tabbar').innerHTML = NAV.filter(n => n.tab).map(n => '<a href="#' + n.r + '" data-r="' + n.r + '">' + icon(n.icon) + '<span>' + (n.short || n.label) + '</span></a>').join('');
  document.getElementById('soundBtn').addEventListener('click', () => {
    Store.d.settings.sound = !Store.d.settings.sound; Store.save(); refreshStats();
    toast(Store.d.settings.sound ? 'Suara aktif' : 'Suara dimatikan');
    Sound.play('correct');
  });
}
function refreshStats(bump) {
  const d = Store.d, lv = levelOf(d.xp);
  const set = (id, v) => { const el = document.getElementById(id); if (el) { if (bump && el.textContent !== String(v)) { el.parentElement.classList.remove('bump'); void el.offsetWidth; el.parentElement.classList.add('bump'); } el.textContent = v; } };
  set('chipStreak', d.streak.count); set('chipStars', totalStars()); set('chipXp', d.xp);
  const lvEl = document.getElementById('chipLevel'); if (lvEl) lvEl.textContent = lv.name;
  const sb = document.getElementById('soundBtn');
  if (sb) { sb.innerHTML = icon(d.settings.sound ? 'volume' : 'mute'); sb.setAttribute('aria-label', d.settings.sound ? 'Matikan suara' : 'Nyalakan suara'); sb.classList.toggle('off', !d.settings.sound); }
}
function applySettings() {
  document.documentElement.classList.toggle('no-anim', !Store.d.settings.anim);
  refreshStats();
}

function router() {
  const raw = location.hash.replace(/^#\/?/, '');
  const cut = raw.indexOf('-');
  const route = cut < 0 ? raw : raw.slice(0, cut);
  const param = cut < 0 ? '' : raw.slice(cut + 1);
  const key = Object.prototype.hasOwnProperty.call(ROUTES, route) ? route : 'beranda';
  document.body.classList.remove('focus-mode');
  document.querySelectorAll('.modal-backdrop').forEach(m => { if (!m.querySelector('.modal-onboard')) m.remove(); });
  const app = document.getElementById('app');
  const page = document.createElement('div');
  page.className = 'page';
  app.innerHTML = '';
  app.appendChild(page);
  try { ROUTES[key](page, param); } catch (err) {
    console.error(err);
    page.innerHTML = '<div class="card center">' + mathyHTML('cheer', 'Ups, ada yang salah. Coba kembali ke Beranda.', { size: 110, cls: 'center' }) + '<a class="btn3d btn-mint" href="#beranda">Beranda</a></div>';
  }
  const navKey = key === 'tahap' ? 'peta' : key === 'bantuan' || key === 'sertifikat' ? 'profil' : key;
  document.querySelectorAll('[data-r]').forEach(a => a.classList.toggle('active', a.dataset.r === navKey));
  window.scrollTo({ top: 0 });
  if (!document.body.classList.contains('focus-mode')) setTimeout(() => { if (!document.querySelector('.modal-backdrop')) flushLevelUps(); }, 400);
}

function onboarding() {
  if (Store.d.onboarded) return;
  modal('<div class="onboard">' + mathyHTML('wave', null, { size: 150, cls: 'center' }) +
    '<h2>Halo! Aku <span>MATHY</span></h2><p>Aku akan menemanimu belajar <b>substitusi aljabar</b>. Kita akan berpetualang di 4 dunia: Penjumlahan, Pengurangan, Perkalian, dan Pembagian!</p>' +
    '<label class="field"><span>Siapa namamu?</span><input id="obName" maxlength="30" placeholder="Tulis namamu di sini"></label></div>',
    [{ label: 'Lewati', cls: 'btn-ghost', onClick: () => finishOnboard('') }, { label: 'AYO MULAI!', cls: 'btn-mint', onClick: (w) => finishOnboard(w.querySelector('#obName').value) }],
    { dismiss: false, cls: 'modal-onboard' });
  const inp = document.getElementById('obName');
  if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.querySelector('.modal-onboard .modal-actions button:last-child').click(); } });
}
function finishOnboard(name) {
  Store.d.name = String(name || '').trim().slice(0, 30);
  Store.d.onboarded = true; Store.save();
  Sound.play('finish'); confetti(60);
  toast('Selamat datang, ' + playerName() + '!');
  router();
}

/* ---------- PWA: pasang aplikasi & mode offline ---------- */
const Install = {
  prompt: null,
  init() {
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); Install.prompt = e; document.querySelectorAll('.install-btn').forEach(b => { b.hidden = false; }); });
    window.addEventListener('appinstalled', () => { Install.prompt = null; toast('SUBMET berhasil dipasang!'); document.querySelectorAll('.install-btn').forEach(b => { b.hidden = true; }); });
    const ok = 'serviceWorker' in navigator && !!document.querySelector('link[rel="manifest"]') && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
    if (ok) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* tidak tersedia */ }); });
  },
  async start() {
    if (!Install.prompt) return;
    Install.prompt.prompt();
    try { await Install.prompt.userChoice; } catch (e) { /* abaikan */ }
    Install.prompt = null;
  }
};

/* ---------- Mulai ---------- */
Store.load();
renderShell();
applySettings();
Install.init();
document.querySelectorAll('.install-btn').forEach(b => b.addEventListener('click', () => Install.start()));
window.addEventListener('hashchange', router);
if (!location.hash) history.replaceState(null, '', '#beranda');
router();
onboarding();

  </script>
</body>
