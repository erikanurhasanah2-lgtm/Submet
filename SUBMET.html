/* =========================================================
   SUBMET – Gaya tampilan
   Palet: hijau mint, biru muda, kuning, putih (+ koral aksen)
   Tata letak: sidebar kiri (desktop) / tab bawah (ponsel),
   konten di tengah, mode fokus penuh saat mengerjakan soal.
   ========================================================= */
:root {
  --mint: #2ED3A0; --mint-d: #1BA87D; --mint-l: #E3FAF1; --mint-m: #9CEBD0;
  --blue: #45BFF5; --blue-d: #1A95CC; --blue-l: #E3F5FE; --blue-m: #A9E0FA;
  --yellow: #FFCD3C; --yellow-d: #E0A800; --yellow-l: #FFF6D6; --yellow-m: #FFE38F;
  --coral: #FF8A65; --coral-d: #E5643E; --coral-l: #FFEDE6;
  --red: #FF6B6B; --red-d: #DC4848; --red-l: #FFE8E8;
  --white: #FFFFFF;
  --bg: #F4FBF8;
  --ink: #2B3A4A; --muted: #6B7A8C; --line: #E1E8EE; --line-d: #CAD5DE;
  --font: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Fredoka", "Nunito", system-ui, sans-serif;
  --math: Georgia, "Times New Roman", serif;
  --r: 20px; --r-sm: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-weight: 700; font-size: 16px; line-height: 1.5;
  color: var(--ink); background: var(--bg); min-height: 100vh;
  background-image: radial-gradient(circle at 15% 0%, rgba(46, 211, 160, .12), transparent 35%), radial-gradient(circle at 100% 30%, rgba(69, 191, 245, .12), transparent 35%);
  background-attachment: fixed;
}
h1, h2, h3 { font-family: var(--font-head); font-weight: 600; line-height: 1.15; margin: 0 0 .4em; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
h2 { font-size: clamp(1.25rem, 2.6vw, 1.55rem); }
h3 { font-size: 1.1rem; }
p { margin: 0 0 .8em; }
a { color: var(--blue-d); text-decoration: none; }
img, svg { max-width: 100%; }
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 10px; }
.muted { color: var(--muted); font-weight: 600; }
.small { font-size: .88rem; }
.center { text-align: center; justify-content: center; margin-left: auto; margin-right: auto; }
.ic { width: 1.25em; height: 1.25em; flex: none; }
[hidden] { display: none !important; }

/* ---------------- Tombol 3D ---------------- */
.btn3d {
  --c: var(--mint); --cd: var(--mint-d); --t: #fff;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 22px; min-height: 48px; border: 0; border-radius: 16px; cursor: pointer;
  background: var(--c); color: var(--t); box-shadow: 0 4px 0 var(--cd);
  font-family: var(--font); font-weight: 900; font-size: 1rem; letter-spacing: .4px; text-transform: none;
  transition: transform .08s, box-shadow .08s, filter .15s; -webkit-tap-highlight-color: transparent; user-select: none;
}
.btn3d:hover { filter: brightness(1.05); }
.btn3d:active:not([disabled]) { transform: translateY(4px); box-shadow: 0 0 0 var(--cd); }
.btn3d[disabled] { --c: #E5EBEF; --cd: #CDD6DD; --t: #9AA7B3; cursor: not-allowed; filter: none; }
.btn3d .ic { width: 20px; height: 20px; }
.btn-mint { --c: var(--mint); --cd: var(--mint-d); }
.btn-blue { --c: var(--blue); --cd: var(--blue-d); }
.btn-yellow { --c: var(--yellow); --cd: var(--yellow-d); --t: #4A3A00; }
.btn-coral { --c: var(--coral); --cd: var(--coral-d); }
.btn-red { --c: var(--red); --cd: var(--red-d); }
.btn-white { --c: #fff; --cd: rgba(0, 0, 0, .15); --t: var(--ink); }
.btn-ghost { --c: #fff; --cd: var(--line-d); --t: var(--muted); border: 2px solid var(--line-d); }
.btn-sm { padding: 8px 14px; min-height: 40px; font-size: .9rem; border-radius: 13px; }
.btn-lg { padding: 16px 30px; min-height: 58px; font-size: 1.1rem; }
.pulse-btn { animation: btnPulse 2.2s ease-in-out infinite; }
@keyframes btnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.icon-btn:hover { background: var(--line); }
.icon-btn .ic { width: 26px; height: 26px; }
.icon-btn.small { width: 34px; height: 34px; vertical-align: middle; }
.icon-btn.small .ic { width: 18px; height: 18px; }
.link-btn { border: 0; background: none; cursor: pointer; font-weight: 900; color: inherit; display: inline-flex; gap: 6px; align-items: center; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
.link { font-weight: 900; color: var(--blue-d); }

/* pill */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; font-size: .8rem; font-weight: 900; background: var(--line); color: var(--muted); }
.pill .ic { width: 15px; height: 15px; }
.pill.mint { background: var(--mint-l); color: var(--mint-d); }
.pill.blue { background: var(--blue-l); color: var(--blue-d); }
.pill.yellow { background: var(--yellow-l); color: #9A7300; }
.pill.coral { background: var(--coral-l); color: var(--coral-d); }
.pill.red { background: var(--red-l); color: var(--red-d); }
.pill.big { font-size: .95rem; padding: 6px 16px; }

/* progress bar */
.pbar { height: 12px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 6px 0; }
.pbar > span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--mint); transition: width 1s cubic-bezier(.2, .8, .2, 1); position: relative; }
.pbar > span::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.pbar.blue > span { background: var(--blue); } .pbar.yellow > span { background: var(--yellow); } .pbar.coral > span { background: var(--coral); }
.pbar.white { background: rgba(255, 255, 255, .35); } .pbar.white > span { background: #fff; }
.pbar.big { height: 18px; }

/* ---------------- Kerangka ---------------- */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 248px; padding: 20px 14px; z-index: 30;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  background: #fff; border-right: 2px solid var(--line); display: flex; flex-direction: column; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); padding: 4px 8px; }
.brand b { font-family: var(--font-head); font-size: 1.6rem; color: var(--mint-d); letter-spacing: .5px; display: block; line-height: 1; }
.brand small { font-size: .72rem; color: var(--muted); }
#sidenav { display: flex; flex-direction: column; gap: 4px; }
#sidenav a { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 14px; color: var(--muted); font-weight: 900; border: 2px solid transparent; letter-spacing: .3px; }
#sidenav a .ic { width: 26px; height: 26px; }
#sidenav a:hover { background: var(--bg); }
#sidenav a.active { background: var(--blue-l); color: var(--blue-d); border-color: var(--blue-m); }
.install-btn { margin-top: auto; }

.main-col { margin-left: 248px; min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; display: flex; align-items: center; gap: 10px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px); border-bottom: 2px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: #fff; }
.mobile-brand { display: none; }
.mobile-brand b { font-size: 1.3rem; }
.topbar .chips { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 12px; font-weight: 900; color: var(--muted); border: 0; background: transparent; cursor: pointer; font-size: 1rem; }
.chip:hover { background: var(--bg); }
.chip .ic { width: 22px; height: 22px; }
.chip.coral { color: var(--coral-d); } .chip.yellow { color: #C99400; } .chip.blue { color: var(--blue-d); }
.chip .xp-lbl { font-size: .75rem; }
.level-chip { background: var(--mint-l); color: var(--mint-d); font-size: .82rem; }
.icon-chip { width: 42px; height: 42px; justify-content: center; color: var(--blue-d); }
.icon-chip.off { color: var(--muted); }
.chip.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.3); } }

#app { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); outline: none; }
.page { animation: pageIn .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

.tabbar { display: none; }
@media (max-width: 900px) {
  .sidebar { display: none; }
  .main-col { margin-left: 0; }
  .mobile-brand { display: flex; }
  .level-chip, .chip .xp-lbl { display: none; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: #fff; border-top: 2px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .68rem; font-weight: 900; }
  .tabbar a .ic { width: 26px; height: 26px; }
  .tabbar a.active { color: var(--blue-d); background: var(--blue-l); }
  #app { padding-bottom: 100px; }
}
.topbar .chips { flex-wrap: nowrap; }
@media (max-width: 480px) {
  .topbar { gap: 4px; }
  .mobile-brand { gap: 6px; padding: 0; }
  .mobile-brand img { width: 30px; height: 30px; }
  .mobile-brand b { font-size: 1.1rem; }
  .topbar .chips { gap: 0; }
  .chip { padding: 6px 5px; font-size: .92rem; gap: 3px; }
  .chip .ic { width: 19px; height: 19px; }
  .icon-chip { width: 36px; height: 36px; }
}

/* mode fokus (mengerjakan soal) */
body.focus-mode .sidebar, body.focus-mode .topbar, body.focus-mode .tabbar { display: none; }
body.focus-mode .main-col { margin-left: 0; }
body.focus-mode #app { max-width: 980px; padding-top: 12px; padding-bottom: 0; }

/* ---------------- Komponen umum ---------------- */
.card { background: #fff; border: 2px solid var(--line); border-radius: var(--r); padding: 22px; }
.card + .card, .card + section, section + .card { margin-top: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head h2 { margin: 0; }
.card h2 { display: flex; align-items: center; gap: 10px; }
.card h2 .ic { color: var(--mint-d); }
.page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.page-head h1 { margin: 0; }
.page-head p { margin: 2px 0 0; color: var(--muted); font-weight: 600; }
.head-ic { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: #fff; flex: none; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
.head-ic .ic { width: 30px; height: 30px; }
.head-ic.mint, .set-ic.mint { background: var(--mint); } .head-ic.blue, .set-ic.blue { background: var(--blue); } .head-ic.yellow, .set-ic.yellow { background: var(--yellow); } .head-ic.coral, .set-ic.coral { background: var(--coral); } .set-ic.red { background: var(--red); }
.section-title { margin: 26px 0 12px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; color: var(--muted); margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
.chip3d { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--line-d); background: #fff; box-shadow: 0 3px 0 var(--line-d); font-weight: 900; cursor: pointer; color: var(--muted); }
.chip3d .ic { width: 18px; height: 18px; }
.chip3d.on { border-color: var(--blue); background: var(--blue-l); color: var(--blue-d); box-shadow: 0 3px 0 var(--blue); }
.rules { list-style: none; padding: 0; margin: 14px 0 18px; display: grid; gap: 8px; }
.rules li { display: flex; gap: 10px; align-items: flex-start; font-weight: 700; }
.rules li .ic { color: var(--mint-d); margin-top: 2px; }
.field { display: grid; gap: 6px; text-align: left; margin-top: 10px; }
.field span { font-weight: 900; }
.field input, select { font: inherit; font-weight: 800; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line-d); background: #fff; color: var(--ink); width: 100%; }
.field input:focus, select:focus { outline: none; border-color: var(--blue); }
select { width: auto; }

/* ---------------- MATHY ---------------- */
.mathy-box { display: flex; align-items: flex-end; gap: 10px; }
.mathy-box.center { justify-content: center; }
.mathy-fig { width: var(--ms, 120px); flex: none; }
.mathy { width: 100%; height: auto; display: block; overflow: visible; }
.bubble { position: relative; background: #fff; border: 2px solid var(--line-d); border-radius: 18px; padding: 10px 14px; font-weight: 800; max-width: 340px; margin-bottom: calc(var(--ms, 120px) * .45); box-shadow: 0 3px 0 var(--line); }
.bubble::before { content: ""; position: absolute; left: -10px; bottom: 16px; width: 16px; height: 16px; background: #fff; border-left: 2px solid var(--line-d); border-bottom: 2px solid var(--line-d); transform: rotate(45deg); }
.bubble.pop { animation: popIn .35s cubic-bezier(.2, .9, .3, 1.4); }
.mathy-box.big .bubble { font-size: 1.05rem; }

.m-all { transform-box: fill-box; transform-origin: 50% 100%; animation: mFloat 3s ease-in-out infinite; }
.m-shadow { transform-box: fill-box; transform-origin: center; animation: mShadow 3s ease-in-out infinite; }
.m-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.m-arm { transform-box: fill-box; transform-origin: 50% 0; transition: transform .35s cubic-bezier(.3, 1.4, .5, 1); }
.m-arm-l { transform: rotate(28deg); }
.m-arm-r { transform: rotate(-28deg); }
.m-antenna { transform-box: fill-box; transform-origin: 50% 100%; animation: antenna 2.4s ease-in-out infinite; }
.m-wave .m-arm-r { transform: rotate(-140deg); animation: wave 1.1s ease-in-out infinite; }
.m-cheer .m-arm-r { transform: rotate(-150deg); }
.m-celebrate .m-arm-l { transform: rotate(140deg); } .m-celebrate .m-arm-r { transform: rotate(-140deg); }
.m-happy .m-all { animation: hop .7s ease-in-out infinite; }
.m-happy .m-arm-l { transform: rotate(60deg); } .m-happy .m-arm-r { transform: rotate(-60deg); }
.m-think .m-all { animation: tilt 3s ease-in-out infinite; }
.m-think .m-arm-r { transform: rotate(68deg); }
.m-think .m-thought { animation: thought 2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
.m-cheer .m-arm-r { animation: pump .8s ease-in-out infinite; }
.m-cheer .m-all { animation: nod 1.6s ease-in-out infinite; }
.m-celebrate .m-all { animation: jump .8s cubic-bezier(.3, .6, .4, 1) infinite; }
.m-celebrate .m-arm-l { animation: armsUpL .8s ease-in-out infinite; } .m-celebrate .m-arm-r { animation: armsUpR .8s ease-in-out infinite; }
.m-spark { animation: sparkle 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes mFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes mShadow { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.9); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes antenna { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
@keyframes wave { 0%, 100% { transform: rotate(-150deg); } 50% { transform: rotate(-115deg); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-14px) scale(.97, 1.03); } 60% { transform: translateY(0) scale(1.04, .96); } }
@keyframes tilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes thought { 0%, 100% { opacity: .85; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
@keyframes pump { 0%, 100% { transform: rotate(-160deg); } 50% { transform: rotate(-135deg); } }
@keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px) rotate(2deg); } }
@keyframes jump { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-22px) rotate(-4deg); } 70% { transform: translateY(0) rotate(3deg); } }
@keyframes armsUpL { 0%, 100% { transform: rotate(150deg); } 50% { transform: rotate(125deg); } }
@keyframes armsUpR { 0%, 100% { transform: rotate(-150deg); } 50% { transform: rotate(-125deg); } }
@keyframes sparkle { 0%, 100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
@keyframes popIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }

/* ---------------- Ekspresi matematika ---------------- */
.expr { font-family: var(--math); font-weight: 700; white-space: nowrap; display: inline-block; }
.tk { display: inline-block; }
.tk.var { font-style: italic; color: var(--blue-d); }
.tk.op { margin: 0 .28em; color: var(--muted); }
.tk.blank { min-width: 1.6em; padding: 0 .3em; border: 2.5px dashed var(--yellow-d); border-radius: 8px; background: var(--yellow-l); color: var(--yellow-d); text-align: center; animation: blankPulse 1.4s ease-in-out infinite; }
@keyframes blankPulse { 50% { background: #FFEFB0; } }
.g { display: inline-block; border-radius: 8px; transition: background .3s, box-shadow .3s; }
.val-chip { display: inline-block; background: var(--yellow-l); border: 2px solid var(--yellow-m); color: #7A5C00; border-radius: 12px; padding: 2px 10px; font-family: var(--math); font-weight: 700; white-space: nowrap; }
.val-chip i { color: var(--blue-d); }

/* ---------------- Pemutar animasi ---------------- */
.solver { background: linear-gradient(180deg, #fff, var(--mint-l)); border: 2px solid var(--mint-m); border-radius: var(--r); padding: 16px; margin: 10px 0; }
.solver-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 1.2rem; }
.solver-head .lbl { font-family: var(--font); font-size: .78rem; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.solver-main { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; margin: 12px 0; min-height: 170px; }
.solver-main > * { min-width: 0; }
.solver-lines { overflow-x: auto; padding: 6px 2px; }
.solver-mathy { flex-direction: row-reverse; align-items: flex-end; }
.solver-mathy .bubble { max-width: 230px; font-size: .9rem; margin-bottom: 40px; }
.solver-mathy .bubble::before { left: auto; right: -10px; transform: rotate(-135deg); }
.solver-ctrl { display: flex; flex-wrap: wrap; gap: 8px; }
.sline { display: flex; align-items: baseline; gap: 10px; font-size: clamp(1.25rem, 3.6vw, 1.75rem); padding: 3px 0; transition: opacity .3s; }
.sline .eq { width: 1em; text-align: right; color: var(--muted); font-family: var(--math); font-weight: 700; flex: none; }
.solver-lines .sline:not(:last-child):not(.active) { opacity: .5; }
.sline.enter .tk { animation: tokPop .45s cubic-bezier(.2, .9, .3, 1.5) both; }
.sline.enter .tk:nth-child(1) { animation-delay: 0s; } .sline.enter .tk:nth-child(2) { animation-delay: .05s; } .sline.enter .tk:nth-child(3) { animation-delay: .1s; } .sline.enter .tk:nth-child(4) { animation-delay: .15s; } .sline.enter .tk:nth-child(5) { animation-delay: .2s; }
@keyframes tokPop { from { opacity: 0; transform: translateY(10px) scale(.5); } to { opacity: 1; transform: none; } }
.sline.active .g.focus { background: var(--yellow-l); box-shadow: 0 0 0 3px var(--yellow-m); animation: focusGlow 1s ease-in-out infinite; }
@keyframes focusGlow { 50% { box-shadow: 0 0 0 5px var(--yellow-m); } }
.sline.enter .g.fresh { background: var(--mint-l); color: var(--mint-d); animation: freshPop .6s cubic-bezier(.2, .9, .3, 1.6) both; }
.sline.enter .g.fresh .tk { color: var(--mint-d); }
@keyframes freshPop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }
.sline.subbing .tk.sp { max-width: 0; opacity: 0; overflow: hidden; }
.sline .tk.sp { max-width: 1em; transition: max-width .3s, opacity .3s; }
.g.morph { background: var(--yellow-l); box-shadow: 0 0 0 3px var(--yellow-m); padding: 0 2px; animation: wiggle .5s ease-in-out 2; }
.g.morph.flip { transform: rotateX(90deg); transition: transform .25s ease-in; }
.g.flipped { animation: flipIn .45s cubic-bezier(.2, .9, .3, 1.4) both; background: var(--yellow-l); box-shadow: 0 0 0 3px var(--yellow); }
.g.flipped .tk { color: #8A6500 !important; }
@keyframes wiggle { 25% { transform: rotate(-8deg) scale(1.1); } 75% { transform: rotate(8deg) scale(1.1); } }
@keyframes flipIn { from { transform: rotateX(-90deg) scale(1.3); } to { transform: none; } }
.sline.final .expr { color: var(--mint-d); }
.sline.final .expr .tk { color: var(--mint-d); font-size: 1.15em; }
.static-sol { background: var(--bg); border-radius: var(--r-sm); padding: 12px 14px; margin-top: 10px; }
.static-sol .sline { font-size: 1.15rem; opacity: 1 !important; }
.static-sol .sline.final .expr { color: var(--mint-d); }
.sol-notes { margin: 8px 0 0; padding-left: 20px; font-size: .9rem; color: var(--muted); }
.calc { overflow-x: auto; }

/* ---------------- Sesi kuis ---------------- */
.lesson, .challenge { min-height: calc(100vh - 12px); min-height: calc(100dvh - 12px); display: flex; flex-direction: column; }
.lesson-top { display: flex; align-items: center; gap: 12px; padding: 8px 0 14px; }
.lbar { flex: 1; height: 18px; background: var(--line); border-radius: 999px; overflow: hidden; }
.lbar span { display: block; height: 100%; width: 0; background: var(--mint); border-radius: 999px; transition: width .6s cubic-bezier(.2, .8, .2, 1); position: relative; }
.lbar span::after { content: ""; position: absolute; left: 10px; right: 10px; top: 4px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .5); }
.lcount { font-weight: 900; color: var(--muted); min-width: 52px; text-align: right; }
.lesson-stage { flex: 1; padding-bottom: 24px; }
.q-wrap { display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: start; }
.q-wrap > * { min-width: 0; }
.q-wrap.enter { animation: slideIn .45s cubic-bezier(.2, .8, .2, 1) both; }
.q-wrap.teach { grid-template-columns: 1fr; }
@keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
.q-side { position: sticky; top: 20px; }
.q-side .mathy-box { flex-direction: column-reverse; align-items: center; }
.q-side .bubble { margin-bottom: 4px; text-align: center; font-size: .92rem; }
.q-side .bubble::before { left: 50%; bottom: -10px; transform: translateX(-50%) rotate(-45deg); }
.q-num { font-weight: 900; color: var(--muted); font-size: .9rem; }
.q-title { font-family: var(--font-head); font-weight: 600; font-size: clamp(1.35rem, 3.2vw, 1.75rem); margin: 0 0 12px; }
.q-card { background: #fff; border: 2px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 16px; overflow-x: auto; }
.q-expr { font-size: clamp(1.7rem, 6vw, 2.5rem); text-align: center; animation: popIn .4s cubic-bezier(.2, .9, .3, 1.4) both; }
.q-vals { text-align: center; margin-top: 8px; font-weight: 800; color: var(--muted); font-size: 1.05rem; }
.q-vals .val-chip { font-size: 1.15rem; }
.tf-claim { font-size: clamp(1.2rem, 4vw, 1.6rem); text-align: center; line-height: 1.8; font-family: var(--font); }
.tf-claim .claim { font-family: var(--math); font-size: 1.3em; color: var(--blue-d); }
.chain .sline { font-size: clamp(1.15rem, 3.6vw, 1.5rem); }

.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.choices.tf { grid-template-columns: 1fr 1fr; }
.choices.mono { grid-template-columns: 1fr; }
.choice {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px; text-align: left;
  border-radius: 16px; border: 2px solid var(--line-d); background: #fff; box-shadow: 0 4px 0 var(--line-d);
  cursor: pointer; font-size: 1.35rem; font-weight: 900; transition: transform .08s, border-color .15s, background .15s;
}
.choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line-d); }
.choice .ck { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line-d); display: grid; place-items: center; font-size: .85rem; color: var(--muted); flex: none; }
.choice .cv { font-family: var(--math); display: flex; align-items: center; gap: 8px; overflow-x: auto; }
.choices.tf .cv { font-family: var(--font); }
.choice.sel { border-color: var(--blue); background: var(--blue-l); box-shadow: 0 4px 0 var(--blue); color: var(--blue-d); }
.choice.sel .ck { border-color: var(--blue); color: var(--blue-d); }
.choice.right { border-color: var(--mint); background: var(--mint-l); box-shadow: 0 4px 0 var(--mint); color: var(--mint-d); animation: correctPop .5s cubic-bezier(.2, .9, .3, 1.5); }
.choice.wrong { border-color: var(--red); background: var(--red-l); box-shadow: 0 4px 0 var(--red); color: var(--red-d); animation: shake .45s; }
.locked .choice, .locked .key, .locked .tile { cursor: default; }
@keyframes correctPop { 50% { transform: scale(1.05); } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

.num-entry { display: flex; justify-content: center; margin-bottom: 14px; }
.num-input { width: min(320px, 100%); text-align: center; font-family: var(--font-head); font-size: 2.2rem; font-weight: 600; padding: 10px; border-radius: 18px; border: 3px solid var(--line-d); background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line-d); }
.num-input:focus { outline: none; border-color: var(--blue); box-shadow: 0 4px 0 var(--blue); }
.num-input.right { border-color: var(--mint); background: var(--mint-l); color: var(--mint-d); box-shadow: 0 4px 0 var(--mint); animation: correctPop .5s; }
.num-input.wrong { border-color: var(--red); background: var(--red-l); color: var(--red-d); box-shadow: 0 4px 0 var(--red); animation: shake .45s; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
.key { height: 54px; border-radius: 14px; border: 2px solid var(--line-d); background: #fff; box-shadow: 0 3px 0 var(--line-d); font-size: 1.4rem; font-weight: 900; cursor: pointer; display: grid; place-items: center; font-family: var(--font-head); }
.key.back { color: var(--coral-d); }
.key.back .ic { width: 26px; height: 26px; }
.key.hit { animation: keyHit .2s; }
@keyframes keyHit { 50% { transform: translateY(3px); box-shadow: none; background: var(--blue-l); } }
@media (pointer: fine) { .keypad { max-width: 280px; } .key { height: 46px; } }

.order-slots { min-height: 70px; border: 2px dashed var(--line-d); border-radius: 16px; padding: 10px; display: grid; gap: 8px; margin-bottom: 14px; background: #fff; }
.order-slots p { margin: 12px; text-align: center; }
.order-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line-d); background: #fff; box-shadow: 0 3px 0 var(--line-d); cursor: pointer; font-size: 1.2rem; max-width: 100%; overflow-x: auto; }
.tile .eq { font-family: var(--math); color: var(--muted); }
.tile.used { visibility: hidden; }
.tile.placed { animation: popIn .3s cubic-bezier(.2, .9, .3, 1.4); justify-content: flex-start; }
.tile .tn { width: 26px; height: 26px; border-radius: 50%; background: var(--blue-l); color: var(--blue-d); display: grid; place-items: center; font-size: .85rem; font-weight: 900; flex: none; }
.tile.right { border-color: var(--mint); background: var(--mint-l); box-shadow: 0 3px 0 var(--mint); }
.tile.wrong { border-color: var(--red); background: var(--red-l); box-shadow: 0 3px 0 var(--red); animation: shake .45s; }

.lesson-foot { --fb: #fff; --fbl: var(--line); position: sticky; bottom: 0; background: var(--fb); box-shadow: 0 0 0 100vmax var(--fb), 0 -2px 0 100vmax var(--fbl); clip-path: inset(-2px -100vmax 0 -100vmax); transition: background .25s, box-shadow .25s; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.foot-inner { max-width: 980px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.fb { flex: 1; min-width: 220px; }
.foot-btns { display: flex; gap: 10px; margin-left: auto; }
.foot-btns .btn3d { min-width: 150px; }
.lesson-foot.good { --fb: var(--mint-l); --fbl: var(--mint-m); }
.lesson-foot.bad { --fb: var(--red-l); --fbl: #FFC6C6; }
.lesson-foot.good .fb, .lesson-foot.bad .fb { animation: footUp .35s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes footUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.fb-row { display: flex; gap: 12px; align-items: center; }
.fb-ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #fff; flex: none; }
.fb-ic .ic { width: 28px; height: 28px; }
.good .fb-ic { color: var(--mint-d); } .bad .fb-ic { color: var(--red-d); }
.fb-title { font-family: var(--font-head); font-weight: 600; font-size: 1.35rem; display: block; }
.good .fb-title, .good .link-btn { color: var(--mint-d); }
.bad .fb-title, .bad .link-btn, .bad .fb p { color: var(--red-d); }
.fb p { margin: 0; }
.fb-sol { max-height: 55vh; overflow-y: auto; }

.teach-body { max-width: 760px; margin: 0 auto; }
.teach-intro { text-align: left; }
.teach-intro .mathy-box { margin-bottom: 12px; }
.teach-h { margin-top: 4px; }
.konsep { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px; margin: 14px 0; }
.kc { background: var(--blue-l); border: 2px solid var(--blue-m); border-radius: 16px; padding: 12px 14px; }
.kc small { display: block; color: var(--blue-d); font-weight: 900; text-transform: uppercase; font-size: .72rem; letter-spacing: .6px; }
.kc b { font-family: var(--math); font-size: 1.25rem; }
.kc b i { color: var(--blue-d); }
.steps { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 8px; margin: 14px 0 0; }
.steps li { counter-increment: s; position: relative; padding: 10px 14px 10px 50px; background: #fff; border: 2px solid var(--line); border-radius: 14px; }
.steps li::before { content: counter(s); position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; background: var(--mint); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: .9rem; }
.steps li i { color: var(--blue-d); font-family: var(--math); }

@media (max-width: 760px) {
  .q-wrap { grid-template-columns: 1fr; }
  .q-side { position: static; order: -1; }
  .q-side .mathy-box { flex-direction: row; align-items: center; }
  .q-side .mathy-fig { width: 70px !important; }
  .q-side .bubble { margin-bottom: 0; text-align: left; }
  .q-side .bubble::before { left: -10px; bottom: auto; top: 50%; transform: translateY(-50%) rotate(45deg); }
  .choices { grid-template-columns: 1fr; }
  .choices.tf { grid-template-columns: 1fr 1fr; }
  .choice { font-size: 1.2rem; min-height: 56px; }
  .foot-btns { width: 100%; }
  .foot-btns .btn3d { flex: 1; min-width: 0; }
  .solver-main { grid-template-columns: 1fr; }
  .solver-mathy { flex-direction: row; }
  .solver-mathy .bubble { margin-bottom: 20px; }
  .solver-mathy .bubble::before { left: -10px; right: auto; transform: rotate(45deg); }
}

/* ---------------- Layar hasil ---------------- */
.end-screen { text-align: center; max-width: 720px; margin: 0 auto; padding: 20px 0 40px; animation: pageIn .5s both; }
.end-hero { position: relative; display: inline-block; }
.trophy-pop { position: absolute; right: -40px; top: 10px; width: 70px; height: 70px; border-radius: 50%; background: var(--yellow); color: #fff; display: grid; place-items: center; box-shadow: 0 5px 0 var(--yellow-d); animation: trophy 1s cubic-bezier(.2, .9, .3, 1.5) .4s both; }
.trophy-pop .ic { width: 40px; height: 40px; }
@keyframes trophy { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.end-title { font-size: clamp(2rem, 6vw, 2.8rem); color: var(--mint-d); animation: popIn .5s cubic-bezier(.2, .9, .3, 1.4) .2s both; }
.end-sub { color: var(--muted); font-weight: 700; }
.end-stars { display: flex; justify-content: center; gap: 10px; margin: 10px 0 18px; }
.es { width: 64px; height: 64px; color: var(--line-d); }
.es .ic { width: 100%; height: 100%; fill: currentColor; }
.es.on { color: var(--yellow); animation: starIn .6s cubic-bezier(.2, .9, .3, 1.6) var(--d) both; }
.es:nth-child(2) { transform: translateY(-12px); }
.es.on:nth-child(2) { animation-name: starIn2; }
@keyframes starIn { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1); } }
@keyframes starIn2 { from { transform: translateY(-12px) scale(0) rotate(-180deg); } to { transform: translateY(-12px) scale(1); } }
.end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px 0 22px; }
.es-tile { border-radius: 16px; border: 2px solid; overflow: hidden; animation: popIn .4s both; }
.es-tile:nth-child(2) { animation-delay: .1s; } .es-tile:nth-child(3) { animation-delay: .2s; }
.es-tile small { display: block; color: #fff; font-weight: 900; font-size: .72rem; letter-spacing: .6px; padding: 4px; }
.es-tile b { display: flex; align-items: center; justify-content: center; gap: 6px; background: #fff; padding: 12px 6px; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.es-tile.yellow { border-color: var(--yellow); background: var(--yellow); } .es-tile.yellow b { color: #B58800; }
.es-tile.mint { border-color: var(--mint); background: var(--mint); } .es-tile.mint b { color: var(--mint-d); }
.es-tile.blue { border-color: var(--blue); background: var(--blue); } .es-tile.blue b { color: var(--blue-d); }
.end-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.end-btns .btn3d { min-width: 170px; }
.review { text-align: left; margin-top: 26px; }
.review summary { cursor: pointer; font-weight: 900; color: var(--blue-d); display: flex; align-items: center; gap: 8px; justify-content: center; padding: 10px; }
.rv { background: #fff; border: 2px solid var(--line); border-left-width: 6px; border-radius: 16px; padding: 14px; margin-top: 12px; }
.rv.ok { border-left-color: var(--mint); } .rv.no { border-left-color: var(--red); }
.rv-head { display: flex; justify-content: space-between; align-items: center; }
.rv-q .q-title { font-size: 1.05rem; margin: 6px 0; }
.rv-q .q-card { padding: 10px; margin-bottom: 8px; }
.rv-q .q-expr { font-size: 1.4rem; }
.big-score { margin: 6px auto 0; }
.big-score small { display: block; font-weight: 900; color: var(--muted); letter-spacing: 1px; }
.big-score b { font-family: var(--font-head); font-size: 4rem; color: #C99400; line-height: 1; }
.big-score span { display: block; color: var(--muted); font-weight: 800; }
@media (max-width: 520px) { .end-stats { gap: 8px; } .es-tile b { font-size: 1.05rem; } .end-btns .btn3d { flex: 1; min-width: 0; } }

/* ---------------- Efek ---------------- */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.9s cubic-bezier(.2, .6, .4, 1) forwards; }
@keyframes fall { to { transform: translate3d(var(--dx), 105vh, 0) rotate(var(--rot)); } }
.burst-star { position: fixed; z-index: 210; width: 24px; height: 24px; margin: -12px 0 0 -12px; color: var(--yellow); pointer-events: none; animation: burst .85s ease-out forwards; }
.burst-star .ic { width: 100%; height: 100%; fill: currentColor; stroke: var(--yellow-d); }
@keyframes burst { 0% { transform: translate(0, 0) scale(.3); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(180deg); opacity: 0; } }
.float-text { position: fixed; z-index: 210; transform: translate(-50%, 0); font-family: var(--font-head); font-weight: 700; font-size: 1.5rem; pointer-events: none; animation: floatUp 1.2s ease-out forwards; color: var(--mint-d); text-shadow: 0 2px 0 #fff; }
.float-text.xp { color: #C99400; } .float-text.pts { color: var(--coral-d); }
@keyframes floatUp { from { opacity: 1; transform: translate(-50%, 0) scale(.8); } to { opacity: 0; transform: translate(-50%, -80px) scale(1.2); } }
.toast {
  position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -120%); opacity: 0; z-index: 220;
  display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 800;
  max-width: calc(100% - 32px); transition: transform .3s cubic-bezier(.2, .9, .3, 1.3), opacity .3s; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.quest { background: var(--mint-d); } .toast.warn { background: var(--coral-d); }
.badge-toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 220; display: flex; gap: 12px; align-items: center; background: #fff; border: 2px solid var(--yellow); border-radius: 18px; padding: 12px 16px; box-shadow: 0 6px 0 var(--yellow-m); max-width: min(340px, calc(100% - 32px)); animation: badgeIn .5s cubic-bezier(.2, .9, .3, 1.4) both; }
.badge-toast.out { animation: badgeOut .35s ease-in forwards; }
.badge-toast small { display: block; color: var(--yellow-d); font-weight: 900; text-transform: uppercase; font-size: .72rem; }
.badge-toast b { display: block; font-family: var(--font-head); font-size: 1.15rem; }
.badge-toast span:last-child { font-size: .85rem; color: var(--muted); }
@keyframes badgeIn { from { transform: translateX(120%); } to { transform: none; } }
@keyframes badgeOut { to { transform: translateX(120%); opacity: 0; } }
.badge-medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .15); }
.badge-medal .ic { width: 28px; height: 28px; }
.badge-medal.mint { background: var(--mint); } .badge-medal.blue { background: var(--blue); } .badge-medal.yellow { background: var(--yellow); } .badge-medal.coral { background: var(--coral); } .badge-medal.grey { background: var(--line-d); }

/* dialog */
.modal-backdrop { position: fixed; inset: 0; z-index: 150; background: rgba(43, 58, 74, .5); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s; }
.modal-backdrop.closing { animation: fadeOut .18s forwards; }
@keyframes fadeIn { from { opacity: 0; } } @keyframes fadeOut { to { opacity: 0; } }

  <script>
/* =========================================================
   SUBMET – Mesin matematika
   - Pohon ekspresi aljabar (AST)
   - Substitusi nilai variabel & langkah penyelesaian bertahap
   - Pembuat soal acak per operasi (+, −, ×, ÷) dan tingkat
   - Pengecoh (distractor) dari kesalahan umum siswa
   ========================================================= */
'use strict';

/* ---------- Bilangan acak (bisa diberi seed untuk Tantangan Harian) ---------- */
const RNG = { fn: Math.random };
function rnd() { return RNG.fn(); }
function rand(a, b) { return Math.floor(rnd() * (b - a + 1)) + a; }
function randNZ(a, b) { let n; do { n = rand(a, b); } while (n === 0); return n; }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function withSeed(seed, fn) { const old = RNG.fn; RNG.fn = mulberry32(seed); try { return fn(); } finally { RNG.fn = old; } }

/* ---------- Format ---------- */
const MINUS = '−';
function fmt(n) { return n < 0 ? MINUS + Math.abs(n) : String(n); }
function parseAnswer(s) {
  const t = String(s == null ? '' : s).trim().replace(/[−–—]/g, '-').replace(/\s+/g, '');
  if (!/^-?\d+$/.test(t)) return NaN;
  return parseInt(t, 10);
}

/* ---------- Pohon ekspresi ----------
   num {v}, var {name}, add/sub/mul/div {l, r}, par {e}
   mul.imp = true  -> perkalian tersirat (2x, 2(3), 3(x + 1))          */
let __nid = 0;
const nid = () => ++__nid;
const E = {
  num: (v) => ({ t: 'num', v, id: nid() }),
  x: (name) => ({ t: 'var', name, id: nid() }),
  add: (l, r) => ({ t: 'add', l, r, id: nid() }),
  sub: (l, r) => ({ t: 'sub', l, r, id: nid() }),
  mul: (l, r) => ({ t: 'mul', l, r, imp: false, id: nid() }),
  imp: (l, r) => ({ t: 'mul', l, r, imp: true, id: nid() }),
  div: (l, r) => ({ t: 'div', l, r, id: nid() }),
  par: (e) => ({ t: 'par', e, id: nid() })
};
/** suku a·x (koefisien 1 ditulis x saja) */
function term(a, name) { return a === 1 ? E.x(name) : E.imp(E.num(a), E.x(name)); }

function evaluate(n, vals) {
  switch (n.t) {
    case 'num': return n.v;
    case 'var': return vals[n.name];
    case 'par': return evaluate(n.e, vals);
    case 'add': return evaluate(n.l, vals) + evaluate(n.r, vals);
    case 'sub': return evaluate(n.l, vals) - evaluate(n.r, vals);
    case 'mul': return evaluate(n.l, vals) * evaluate(n.r, vals);
    case 'div': return evaluate(n.l, vals) / evaluate(n.r, vals);
  }
  throw new Error('node tidak dikenal');
}
function varsOf(n, out) {
  out = out || [];
  if (n.t === 'var') { if (!out.includes(n.name)) out.push(n.name); }
  ['l', 'r', 'e'].forEach(k => { if (n[k]) varsOf(n[k], out); });
  return out;
}
function nodeIds(n, pred, out) {
  out = out || new Set();
  if (pred(n)) out.add(n.id);
  ['l', 'r', 'e'].forEach(k => { if (n[k]) nodeIds(n[k], pred, out); });
  return out;
}
function findNode(n, id) {
  if (n.id === id) return n;
  for (const k of ['l', 'r', 'e']) if (n[k]) { const f = findNode(n[k], id); if (f) return f; }
  return null;
}

/* ---------- Tampilan ----------
   opt: { focus:Set, fresh:Set, blank:id, concat:bool, impPlus:bool } */
const SYM = { add: '+', sub: MINUS, mul: '×', div: '÷' };
function tk(cls, txt) { return '<span class="tk ' + cls + '">' + txt + '</span>'; }
function render(root, opt) {
  const o = opt || {};
  function wrap(n, html) {
    const c = [];
    if (o.focus && o.focus.has(n.id)) c.push('focus');
    if (o.fresh && o.fresh.has(n.id)) c.push('fresh');
    if (n.sub && o.fresh && o.fresh.has(n.id)) c.push('subbed');
    if (!c.length) return html;
    return '<span class="g ' + c.join(' ') + '"' + (n.sub ? ' data-var="' + n.from + '"' : '') + '>' + html + '</span>';
  }
  function numTok(n) { return o.blank === n.id ? tk('blank', '?') : tk('num', fmt(n.v)); }
  function R(n, lead) {
    switch (n.t) {
      case 'num':
        if (n.v < 0 && !lead && o.blank !== n.id) return wrap(n, tk('pa', '(') + numTok(n) + tk('pa', ')'));
        return wrap(n, numTok(n));
      case 'var': return wrap(n, tk('var', n.name));
      case 'par': return wrap(n, tk('pa', '(') + R(n.e, true) + tk('pa', ')'));
      case 'mul':
        if (n.imp) {
          const L = R(n.l, lead);
          if (n.r.t === 'num') {
            if (o.concat && n.r.v >= 0) return wrap(n, L + wrap(n.r, tk('num', String(n.r.v))));
            if (o.impPlus) return wrap(n, L + tk('op', '+') + R(n.r, false));
            return wrap(n, L + tk('pa sp', '(') + wrap(n.r, numTok(n.r)) + tk('pa sp', ')'));
          }
          return wrap(n, L + R(n.r, false));
        }
      // eslint-disable-next-line no-fallthrough
      default:
        return wrap(n, R(n.l, lead) + tk('op', SYM[n.t]) + R(n.r, false));
    }
  }
  return R(root, true);
}
function toText(html) {
  return html.replace(/<span class="tk op[^"]*">([^<]*)<\/span>/g, ' $1 ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}
function exprText(root, opt) { return toText(render(root, opt)); }

/* ---------- Substitusi & penyelesaian bertahap ---------- */
function substituteTree(n, vals, ids) {
  if (n.t === 'var') { const nn = { t: 'num', v: vals[n.name], id: nid(), sub: true, from: n.name }; ids.add(nn.id); return nn; }
  const c = Object.assign({}, n);
  if (n.l) c.l = substituteTree(n.l, vals, ids);
  if (n.r) c.r = substituteTree(n.r, vals, ids);
  if (n.e) c.e = substituteTree(n.e, vals, ids);
  return c;
}
function applyOp(t, a, b) { return t === 'add' ? a + b : t === 'sub' ? a - b : t === 'mul' ? a * b : a / b; }
const OPNAME = { add: 'penjumlahan', sub: 'pengurangan', mul: 'perkalian', div: 'pembagian' };

function reduceOnce(tree) {
  const ready = [];
  (function walk(n, inPar) {
    if (n.t === 'add' || n.t === 'sub' || n.t === 'mul' || n.t === 'div') {
      if (n.l.t === 'num' && n.r.t === 'num') ready.push(n);
      else { walk(n.l, inPar); walk(n.r, inPar); }
    } else if (n.t === 'par') walk(n.e, true);
  })(tree, false);
  const md = ready.filter(n => n.t === 'mul' || n.t === 'div');
  const chosen = md.length ? md : ready;
  const ids = new Set(chosen.map(n => n.id));
  const info = [], fresh = new Set();
  function rebuild(n, inPar) {
    if (ids.has(n.id)) {
      const v = applyOp(n.t, n.l.v, n.r.v);
      const nn = { t: 'num', v, id: nid() };
      fresh.add(nn.id);
      info.push({ op: n.t, a: n.l.v, b: n.r.v, v, inPar });
      return nn;
    }
    switch (n.t) {
      case 'num': return n.sub ? { t: 'num', v: n.v, id: n.id } : n;
      case 'var': return n;
      case 'par': { const e = rebuild(n.e, true); return e.t === 'num' ? e : Object.assign({}, n, { e }); }
      default: return Object.assign({}, n, { l: rebuild(n.l, inPar), r: rebuild(n.r, inPar) });

  }

    fmt(i.a) + ' ' + SYM[i.op] + ' ' + p(i.b) + ' = ' + fmt(i.v)).join('. ') + '.';
}

/** Menghasilkan semua baris penyelesaian.
 *  lines[i] = { tree, focus:Set, fresh:Set, note, html, text } */
function solve(expr, vals) {
  const names = varsOf(expr);
  const lines = [];
  lines.push({ tree: expr, focus: nodeIds(expr, n => n.t === 'var'), fresh: new Set(), note: 'Perhatikan ekspresinya. Variabelnya akan kita ganti dengan angka.' });
  const subIds = new Set();
  const subbed = substituteTree(expr, vals, subIds);
  lines.push({ tree: subbed, focus: new Set(), fresh: subIds, note: 'Ganti ' + names.map(n => n + ' dengan ' + fmt(vals[n])).join(' dan ') + ' (pakai tanda kurung).' });
  let cur = subbed, guard = 0;
  while (cur.t !== 'num') {
    const r = reduceOnce(cur);
    lines[lines.length - 1].focus = r.reduced;
    lines.push({ tree: r.next, focus: new Set(), fresh: r.fresh, note: describe(r.info) });
    cur = r.next;
    if (++guard > 30) throw new Error('reduksi tidak selesai');
  }
  lines.forEach(l => { l.html = render(l.tree, { focus: l.focus, fresh: l.fresh }); l.text = toText(l.html); });
  return { lines, result: cur.v };
}

const MISTAKE_HINT = {
  concat: 'Ingat: 2x artinya 2 × x. Jadi kalau x = 3, 2x = 2 × 3 = 6, bukan 23.',
  addImp: 'Koefisien dan variabel itu dikalikan, bukan dijumlahkan.',
  signFlip: 'Perhatikan tandanya. Itu pengurangan, jadi angkanya dikurangi.',
  divAsMul: 'Tanda ÷ artinya dibagi, bukan dikali.',
  partialDiv: 'Seluruh isi kurung harus dibagi, bukan hanya suku pertamanya.',
  ltr: 'Urutan hitung: kurung dulu, lalu × dan ÷, baru + dan −.',
  generic: 'Tidak apa-apa! Coba hitung lagi pelan-pelan, langkah demi langkah.'
};
function evalMode(n, vals, mode) {
  const ev = (x) => evalMode(x, vals, mode);
  switch (n.t) {
    case 'num': return n.v;
    case 'var': return vals[n.name];
    case 'par': return ev(n.e);
    case 'add': return ev(n.l) + ev(n.r);
    case 'sub': return mode === 'signFlip' ? ev(n.l) + ev(n.r) : ev(n.l) - ev(n.r);
    case 'mul': {
      const a = ev(n.l), b = ev(n.r);
      if (n.imp && mode === 'concat' && n.r.t === 'var' && a > 0 && b >= 0) return Number(String(a) + String(b));
      if (n.imp && mode === 'addImp' && n.r.t === 'var') return a + b;
      return a * b;
    }
    case 'div': {
      const b = ev(n.r);
      if (mode === 'divAsMul') return ev(n.l) * b;
      if (mode === 'partialDiv' && n.l.t === 'par' && (n.l.e.t === 'add' || n.l.e.t === 'sub')) {
        const p = ev(n.l.e.l) / b, q = ev(n.l.e.r);
        return n.l.e.t === 'add' ? p + q : p - q;
      }
      return ev(n.l) / b;
    }

}

  switch (n.t) {
    case 'num': out.push(n.v); break;

    case 'par': flatTokens(n.e, vals, out); break;

}

function mistakes(p) {

}

  const opts = shuffle(m.values).slice(0, 3);

  while (opts.length < 3) {
    [p.result + k, p.result - k, p.result + 2 * k].forEach(c => { if (opts.length < 3 && c !== p.result && !opts.includes(c)) opts.push(c); });
    k++;
  }
  return { options: shuffle([p.result].concat(opts)), hints: m.hints };
}

/** Membuat satu soal: { op, level, expr, vals, result } */
function genProblem(op, level) {
  const o = op === 'any' ? pick(OPS) : op;
  const lv = Math.max(1, Math.min(3, level || 1));
  for (let tries = 0; tries < 50; tries++) {
    const g = pick(GEN[o][lv])();
    const result = evaluate(g.expr, g.vals);
    if (Number.isInteger(result) && Math.abs(result) < 1000) return { op: o, level: lv, expr: g.expr, vals: g.vals, result };
  }

'use strict';

const LEVELS = [
  { name: 'Pemula', min: 0, color: 'mint' },

  { name: 'Ahli Aljabar', min: 500, color: 'yellow' },

];
function levelOf(xp) {
  let i = 0;
  LEVELS.forEach((l, k) => { if (xp >= l.min) i = k; });
  const cur = LEVELS[i], next = LEVELS[i + 1];
  const pct = next ? Math.round(((xp - cur.min) / (next.min - cur.min)) * 100) : 100;
  return { idx: i, name: cur.name, color: cur.color, min: cur.min, next: next ? next.min : null, nextName: next ? next.name : null, pct };
}

function todayStr(d) {
  const t = d || new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
}
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return todayStr(d); }

const Store = {
  key: 'submet-interaktif-v1',
  d: null,
  defaults() {
    return {
      name: '',
      onboarded: false,
      xp: 0,
      stages: {},            // { 'add-1': { done, stars, best } }
      materiRead: {},        // { add: true }
      badges: {},            // { id: tanggal }
      stats: { answered: 0, correct: 0, latihan: 0, challengePlayed: 0, challengeBest: { mudah: 0, sedang: 0, sulit: 0 }, dailyCount: 0 },
      evaluasi: { attempts: 0, best: 0, last: null, history: [] },
      daily: { date: '', xp: 0, correct: 0, stages: 0, done: false, claimed: {} },
      streak: { count: 0, last: '' },
      settings: { sound: true, anim: true, timer: 45 }
    };
  },
  load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(this.key)); } catch (e) { saved = null; }
    const d = this.defaults();
    if (saved && typeof saved === 'object') {
      ['name', 'onboarded', 'xp'].forEach(k => { if (k in saved) d[k] = saved[k]; });
      ['stages', 'materiRead', 'badges'].forEach(k => Object.assign(d[k], saved[k] || {}));
      Object.assign(d.stats, saved.stats || {});
      d.stats.challengeBest = Object.assign({ mudah: 0, sedang: 0, sulit: 0 }, (saved.stats || {}).challengeBest || {});
      Object.assign(d.evaluasi, saved.evaluasi || {});
      if (!Array.isArray(d.evaluasi.history)) d.evaluasi.history = [];
      Object.assign(d.daily, saved.daily || {});
      if (!d.daily.claimed) d.daily.claimed = {};
      Object.assign(d.streak, saved.streak || {});
      Object.assign(d.settings, saved.settings || {});
    }
    this.d = d;
    ensureDaily();
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch (e) { /* penyimpanan tidak tersedia */ } },
  reset() { const s = this.d.settings; this.d = this.defaults(); this.d.settings = s; this.d.onboarded = false; ensureDaily(); this.save(); }
};

function ensureDaily() {
  const t = todayStr();
  if (Store.d.daily.date !== t) Store.d.daily = { date: t, xp: 0, correct: 0, stages: 0, done: false, claimed: {} };
  // streak putus jika lewat lebih dari sehari
  if (Store.d.streak.last && Store.d.streak.last !== t && Store.d.streak.last !== yesterdayStr()) Store.d.streak.count = 0;
}
function touchStreak() {
  const t = todayStr(), s = Store.d.streak;
  if (s.last === t) return;
  s.count = s.last === yesterdayStr() ? s.count + 1 : 1;
  s.last = t;
}
function playerName() { return Store.d.name || 'Pejuang Matematika'; }

const Events = { levelUps: [] };

function addXP(n) {
  if (!n) return;
  ensureDaily();
  const before = levelOf(Store.d.xp).idx;
  Store.d.xp += n;
  Store.d.daily.xp += n;
  touchStreak();
  const after = levelOf(Store.d.xp);
  if (after.idx > before) Events.levelUps.push(after.name);
  Store.save();
  if (typeof refreshStats === 'function') refreshStats(true);
  checkQuests();
  checkBadges();
}

  ensureDaily();
  Store.d.stats.answered++;
  if (ok) { Store.d.stats.correct++; Store.d.daily.correct++; }
  Store.save();
}

  QUESTS.forEach(q => {
    if (!d.claimed[q.id] && q.val(d) >= q.target) {
      d.claimed[q.id] = true;
      Store.save();
      if (typeof toast === 'function') toast('Misi harian selesai: ' + q.text + ' (+' + q.reward + ' XP)', 'quest');
      addXP(q.reward);
    }
  });
}

/* ---------- Suara (Web Audio, tanpa file) ---------- */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ctx = new AC(); } catch (e) { return null; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, at, dur, type, vol) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol || 0.14, at + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(c.destination); o.start(at); o.stop(at + dur + 0.02);
  },
  play(name) {
    if (!Store.d || !Store.d.settings.sound) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + 0.01;
    switch (name) {
      case 'tap': this.tone(520, t, 0.06, 'triangle', 0.06); break;
      case 'correct': this.tone(660, t, 0.14, 'sine', 0.16); this.tone(990, t + 0.11, 0.22, 'sine', 0.16); break;
      case 'wrong': this.tone(330, t, 0.16, 'triangle', 0.12); this.tone(247, t + 0.14, 0.24, 'triangle', 0.12); break;
      case 'xp': this.tone(1175, t, 0.08, 'square', 0.04); this.tone(1568, t + 0.06, 0.1, 'square', 0.04); break;
      case 'star': this.tone(1320, t, 0.12, 'sine', 0.1); break;
      case 'level': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, t + i * 0.11, 0.3, 'triangle', 0.13)); break;
      case 'finish': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, t + i * 0.09, 0.26, 'sine', 0.13)); break;
      case 'pop': this.tone(880, t, 0.05, 'sine', 0.07); break;
      case 'whoosh': this.tone(400, t, 0.12, 'sine', 0.05); this.tone(700, t + 0.05, 0.1, 'sine', 0.05); break;
    }
  }
};

/* ---------- Animasi aktif? ---------- */
function animOn() { return !Store.d || Store.d.settings.anim; }

/* ---------- Confetti & bintang ---------- */
function confetti(n) {
  if (!animOn()) return;
  const colors = ['#2ED3A0', '#45BFF5', '#FFCD3C', '#FF8A65', '#9BE7FF', '#FFE58A'];
  const wrap = document.createElement('div');
  wrap.className = 'confetti';
  for (let i = 0; i < (n || 40); i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    if (i % 3 === 0) p.style.borderRadius = '50%';
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 2200);
}
function starBurst(el, count) {
  if (!animOn() || !el) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < (count || 8); i++) {
    const s = document.createElement('span');
    s.className = 'burst-star';
    s.innerHTML = icon('star');
    const ang = (Math.PI * 2 * i) / (count || 8), dist = 60 + Math.random() * 40;
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }
}
function floatText(el, text, cls) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float-text ' + (cls || '');
  f.textContent = text;
  f.style.left = (r.left + r.width / 2) + 'px';
  f.style.top = (r.top) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1200);
}
function countUp(el, to, ms) {
  if (!el) return;
  if (!animOn()) { el.textContent = to; return; }
  const start = performance.now(), dur = ms || 900;
  (function step(now) {
    const k = Math.min(1, (now - start) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(step);
  })(start);
}

/* ---------- Toast & badge ---------- */
let __toastT = null;
function toast(msg, kind) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.className = 'toast show ' + (kind || '');
  el.innerHTML = (kind === 'quest' ? icon('target') : kind === 'warn' ? icon('lock') : icon('sparkle')) + '<span>' + msg + '</span>';
  clearTimeout(__toastT);
  __toastT = setTimeout(() => { el.className = 'toast ' + (kind || ''); }, 2600);
}
const __badgeQueue = [];
function badgeToast(b) {
  __badgeQueue.push(b);
  if (__badgeQueue.length === 1) showNextBadge();
}
function showNextBadge() {
  const b = __badgeQueue[0];
  if (!b) return;
  const el = document.createElement('div');
  el.className = 'badge-toast';
  el.innerHTML = '<span class="badge-medal ' + b.color + '">' + icon(b.icon) + '</span><div><small>Badge baru!</small><b>' + b.name + '</b><span>' + b.desc + '</span></div>';
  document.body.appendChild(el);
  Sound.play('star');
  setTimeout(() => { el.classList.add('out'); }, 3000);
  setTimeout(() => { el.remove(); __badgeQueue.shift(); showNextBadge(); }, 3400);
}

/* ---------- Dialog ---------- */
function modal(html, buttons, opts) {
  const o = opts || {};
  document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());
  const wrap = document.createElement('div');

  const close = () => { wrap.classList.add('closing'); setTimeout(() => wrap.remove(), 180); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && o.dismiss !== false) close(); };
  wrap.addEventListener('click', (e) => { if (e.target === wrap && o.dismiss !== false) close(); });
  wrap.querySelectorAll('[data-i]').forEach(btn => btn.addEventListener('click', () => {
    const b = buttons[+btn.dataset.i];

  }));
  document.addEventListener('keydown', onKey);
  document.body.appendChild(wrap);
  const first = wrap.querySelector('input') || wrap.querySelector('.modal-actions button:last-child');
  if (first) first.focus();
  return wrap;
}

   dan mesin sesi kuis (gaya Duolingo)
